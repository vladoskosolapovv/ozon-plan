async function handlePlanFile(file) {

/* ============ НАСТРОЙКИ: мои артикулы ============ */
const SET_COLS = ['Кабинет', 'Категория', 'Артикул', 'На ведении'];

function catDraft() {
  const C = S.cat;
  if (!C.draft) {
    const d = clone(catalogDoc());
    C.derived = !!d.derived; delete d.derived;
    d.cabinets = d.cabinets || [];
    C.draft = d; C.dirty = C.derived && d.items.length > 0; C.sel = new Set();
  }
  return C.draft;
}
function catSetDirty() {
  S.cat.dirty = true;
  const n = $('#setDirty'); if (n) n.textContent = 'Есть несохранённые изменения';
  ['#setSave', '#setUndo'].forEach(id => { const b = $(id); if (b) b.disabled = false; });
}
const catCabs = d => { const c = (d.cabinets || []).slice(); d.items.forEach(it => { if (!c.includes(it.cab)) c.push(it.cab); }); return c; };

// артикулы из загруженных отчётов, которых нет в настройках
function reportArts(d) {
  const known = new Set(d.items.map(it => it.art));
  const seen = {};
  Object.keys(S.facts).sort().forEach(id => {
    const f = S.facts[id];
    for (const a in (f.o || {})) { const o = f.o[a]; seen[a] = seen[a] || {rub: 0}; seen[a].rub += o[1] || 0; }
    for (const a in (f.p || {})) { seen[a] = seen[a] || {rub: 0}; }
  });
  return Object.keys(seen).filter(a => !known.has(a)).map(a => ({art: a, rub: seen[a].rub})).sort((a, b) => b.rub - a.rub);
}

function bulkHtml() {
  const C = S.cat, d = catDraft(), nSel = C.sel.size;
  if (!nSel) return '';
  const cats = [...new Set(d.items.filter(it => !C.cab || it.cab === C.cab).map(it => it.cat).filter(Boolean))];
  return `<div class="bulk">Выбрано: <b>${nSel}</b>
      <input id="bulkCat" list="dlbulk" placeholder="Новая категория" aria-label="Категория для выбранных">

      <button type="button" class="btn danger" id="bulkRm">Убрать из списка</button>
      <button type="button" class="linkbtn" id="bulkClear">снять выделение</button></div>`;
}

function setFocusKeep(sel, fn) {
  const a = document.activeElement, keep = a && a.matches && a.matches(sel) ? {s: sel, p: a.selectionStart} : null;
  fn();
  if (keep) { const n = $(keep.s); if (n) { n.focus(); try { n.setSelectionRange(keep.p, keep.p); } catch (e) {} } }
}

async function readSettingsXlsx(file) {
  const rows = await readXlsx(file);
  let hi = -1;
  for (let i = 0; i < Math.min(rows.length, 15); i++) if ((rows[i] || []).some(h => /артикул/i.test(String(h ?? '')))) { hi = i; break; }
  if (hi < 0) throw new Error('нет строки заголовков с колонкой «Артикул»');
  const head = (rows[hi] || []).map(h => String(h ?? '').trim().toLowerCase());
  const col = {};
  head.forEach((h, i) => {
    if (col.art == null && /артикул/.test(h)) col.art = i;
    else if (col.cab == null && /кабинет/.test(h)) col.cab = i;
    else if (col.cat == null && /категор/.test(h)) col.cat = i;
    else if (col.on == null && /ведени|мо[йи]|статус|актив/.test(h)) col.on = i;
  });
  if (col.cab == null) throw new Error('нужна колонка «Кабинет»');
  const out = [];
  let cab = '', cat = '';
  rows.slice(hi + 1).forEach(r => {
    r = r || [];
    const v = c => col[c] != null && has(r[col[c]]) ? String(r[col[c]]).trim() : '';
    if (v('cab')) cab = v('cab');
    if (v('cat')) cat = v('cat');
    const art = v('art');
    if (!art || !cab) return;
    const onRaw = v('on').toLowerCase();
    out.push({cab, art, cat: col.cat != null ? cat : null, on: col.on == null || !onRaw ? null : !/^(нет|no|0|false|ложь|-|не)/.test(onRaw)});
  });
  if (!out.length) throw new Error('в файле нет строк с артикулами');
  return out;
}

async function saveCatalogDraft() {
  const d = clone(catDraft());
  d.items = d.items.filter(it => it.art && it.cab);
  d.items.forEach(it => { it.cat = String(it.cat || '').trim() || 'Без категории'; });
  d.cabinets = catCabs(d);
  d.updatedAt = new Date().toISOString();
  try {
    await Backend.saveCatalog(d);
    S.catalog = d; S.cat.draft = null; S.cat.dirty = false; S.cat.derived = false;
    if (!S.dirty) S.draft = null; // план месяца перестроится по новым категориям
    S.cat.msg = {t: 'ok', html: 'Настройки сохранены. План и трекер пересчитаны по новым категориям.'};
    pushHistory();
  } catch (e) {
    S.cat.msg = {t: 'err', html: 'Не сохранилось: ' + esc(e.message)};
  }
  renderAll();
}

function settingsClick(b) {
  const C = S.cat, d = catDraft();
  if (b.dataset.setcab != null) { C.cab = b.dataset.setcab; pref.set('setCab', C.cab); C.sel = new Set(); renderSettings(); return true; }
  if (b.dataset.setst != null) { C.status = b.dataset.setst; renderSettings(); return true; }
  if (b.dataset.rm != null) { d.items.splice(+b.dataset.rm, 1); C.sel = new Set(); catSetDirty(); renderSettings(); return true; }
  switch (b.id) {
    case 'setSave': b.disabled = true; b.textContent = 'Сохраняю…'; saveCatalogDraft(); return true;
    case 'setUndo': C.draft = null; C.dirty = false; C.msg = null; renderSettings(); return true;
    case 'setAddOpen': C.adding = true; renderSettings(); const a = $('#addArt'); if (a) a.focus(); return true;
    case 'setAddClose': C.adding = false; renderSettings(); return true;
    case 'setAdd': {
      const cab = $('#addCab').value.trim(), cat = $('#addCat').value.trim();
      const arts = $('#addArt').value.split(/[\n,;]+/).map(x => x.trim()).filter(Boolean);
      if (!cab || !arts.length) { C.msg = {t: 'err', html: 'Укажите кабинет и артикул.'}; renderSettings(); return true; }
      let n = 0;
      arts.forEach(art => {
        const it = d.items.find(x => x.cab === cab && x.art === art);
        if (it) { if (cat) it.cat = cat; it.on = true; } else { d.items.push({cab, art, cat: cat || 'Без категории', on: true}); n++; }
      });
      if (!d.cabinets.includes(cab)) d.cabinets.push(cab);
      C.msg = {t: 'ok', html: `Добавлено: ${n}${arts.length > n ? `, обновлено: ${arts.length - n}` : ''}. Не забудьте сохранить.`};
      catSetDirty(); renderSettings(); return true;
    }
    case 'bulkSetCat': {
      const cat = ($('#bulkCat').value || '').trim();
      if (!cat) { const i = $('#bulkCat'); if (i) i.focus(); return true; }
      C.sel.forEach(i => { if (d.items[i]) d.items[i].cat = cat; });
      C.msg = {t: 'ok', html: `Категория «${esc(cat)}» задана для ${C.sel.size} арт. Не забудьте сохранить.`};
      C.sel = new Set(); catSetDirty(); renderSettings(); return true;
    }
    case 'bulkOn': case 'bulkOff': C.sel.forEach(i => { if (d.items[i]) d.items[i].on = b.id === 'bulkOn'; }); C.sel = new Set(); catSetDirty(); renderSettings(); return true;
    case 'bulkRm': d.items = d.items.filter((_, i) => !C.sel.has(i)); C.sel = new Set(); catSetDirty(); renderSettings(); return true;
    case 'bulkClear': C.sel = new Set(); renderSettings(); return true;
    case 'frAll': document.querySelectorAll('input[data-fr]').forEach(x => { x.checked = true; }); return true;
    case 'frAdd': case 'frOff': {
      const arts = [...document.querySelectorAll('input[data-fr]:checked')].map(x => x.dataset.fr);
      const cab = $('#frCab') ? $('#frCab').value : '';
      if (!arts.length || !cab) { C.msg = {t: 'err', html: 'Отметьте артикулы и выберите кабинет.'}; renderSettings(); return true; }
      const cat = ($('#frCat').value || '').trim() || (b.id === 'frOff' ? 'Не мои' : 'Без категории');
      arts.forEach(art => d.items.push({cab, art, cat, on: b.id === 'frAdd'}));
      C.msg = {t: 'ok', html: `${b.id === 'frAdd' ? 'Добавлено в мои' : 'Отмечено как не мои'}: ${arts.length}. Не забудьте сохранить.`};
      catSetDirty(); renderSettings(); return true;
    }
    case 'setOut': {
      const cabs = catCabs(d);
      const rows = d.items.slice().sort((a, b) => cabs.indexOf(a.cab) - cabs.indexOf(b.cab)).map(it => [it.cab, it.cat, it.art, it.on === false ? 'нет' : 'да']);
      downloadXlsx('my-articles.xlsx', 'Мои артикулы', SET_COLS, rows, [14, 28, 32, 12], [0, 0, 0, 0]).catch(e => { C.msg = {t: 'err', html: 'Не выгрузилось: ' + esc(e.message)}; renderSettings(); });
      return true;
    }
  }
  return false;
}

function settingsChange(t) {
  const C = S.cat, d = catDraft();
  if (t.dataset.sel != null) { const i = +t.dataset.sel; t.checked ? C.sel.add(i) : C.sel.delete(i); updateBulk(); return true; }
  if (t.dataset.selg != null) {
    // только видимые сейчас артикулы категории (с учётом фильтра и поиска)
    document.querySelectorAll('input[data-sel]').forEach(x => {
      if (x.dataset.g !== t.dataset.selg) return;
      x.checked = t.checked; t.checked ? C.sel.add(+x.dataset.sel) : C.sel.delete(+x.dataset.sel);
    });
    updateBulk(); return true;
  }
  if (t.dataset.it != null) {
    const [i, f] = t.dataset.it.split('.');
    const it = d.items[+i]; if (!it) return true;
    if (f === 'on') { it.on = t.checked; const tr = t.closest('tr'); if (tr) tr.classList.toggle('offrow', !t.checked); catSetDirty(); return true; }
    it.cat = t.value.trim();
    catSetDirty(); renderSettings(); return true;
  }
  if (t.dataset.rencat != null) {
    const [cab, ...rest] = t.dataset.rencat.split('|'), old = rest.join('|'), nv = t.value.trim();
    if (!nv) { renderSettings(); return true; }
    d.items.forEach(it => { if (it.cab === cab && it.cat === old) it.cat = nv; });
    catSetDirty(); renderSettings(); return true;
  }
  if (t.id === 'setFile') {
    const file = t.files[0]; t.value = '';
    if (!file) return true;
    readSettingsXlsx(file).then(rows => {
      let up = 0, add = 0;
      rows.forEach(r => {
        const it = d.items.find(x => x.cab === r.cab && x.art === r.art);
        if (it) { if (r.cat) it.cat = r.cat; if (r.on != null) it.on = r.on; up++; }
        else { d.items.push({cab: r.cab, art: r.art, cat: r.cat || 'Без категории', on: r.on == null ? true : r.on}); add++; }
        if (!d.cabinets.includes(r.cab)) d.cabinets.push(r.cab);
      });
      C.msg = {t: 'ok', html: `Из файла «${esc(file.name)}»: обновлено ${up}, добавлено ${add}. Артикулы, которых нет в файле, не тронуты. Проверьте и сохраните.`};
      catSetDirty(); renderSettings();
    }).catch(e => { C.msg = {t: 'err', html: 'Файл не прочитан: ' + esc(e.message)}; renderSettings(); });
    return true;
  }
  return false;
}

/* ============ ЗАГРУЗКА ДАННЫХ ============ */
const colIdx = s => s.split('').reduce((a, ch) => a * 26 + ch.charCodeAt(0) - 64, 0) - 1;

async function readXlsx(file) {
  await ensureJSZip();
  const zip = await JSZip.loadAsync(file);
  const names = Object.keys(zip.files);
  let sheet = names.find(n => /^xl\/worksheets\/sheet1\.xml$/i.test(n)) || names.find(n => /^xl\/worksheets\/[^/]+\.xml$/i.test(n));
  if (!sheet) throw new Error('В файле нет листа с данными');
  const parser = new DOMParser();
  let ss = [];
  const ssName = names.find(n => /^xl\/sharedStrings\.xml$/i.test(n));
  if (ssName) {
    const d = parser.parseFromString(await zip.file(ssName).async('string'), 'application/xml');
    ss = Array.from(d.getElementsByTagNameNS('*', 'si')).map(si => Array.from(si.getElementsByTagNameNS('*', 't')).map(t => t.textContent).join(''));
  }
  const doc = parser.parseFromString(await zip.file(sheet).async('string'), 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('Файл повреждён: не читается лист');
  const rows = [];
  rows.formula = new Set(); // «строка:колонка» ячеек с формулой — чтобы отличать итоговые суммы от введённых чисел
  for (const row of Array.from(doc.getElementsByTagNameNS('*', 'row'))) {
    const out = [];
    let i = 0;
    for (const c of Array.from(row.children)) {
      if (c.localName !== 'c') continue;
      const m = /^([A-Z]+)(\d+)$/.exec(c.getAttribute('r') || '');
      if (m) i = colIdx(m[1]);
      const t = c.getAttribute('t');
      let v = null;
      const vEl = Array.from(c.children).find(x => x.localName === 'v');
      const isEl = Array.from(c.children).find(x => x.localName === 'is');
      if (Array.from(c.children).some(x => x.localName === 'f')) rows.formula.add(rows.length + ':' + i);
      if (isEl) v = isEl.textContent;
      else if (vEl) {
        v = vEl.textContent;
        if (t === 's') v = ss[+v];
        else if (t === 'b') v = v === '1';
        else if (t !== 'str' && t !== 'inlineStr' && t !== 'e') { const n = Number(v); if (!isNaN(n)) v = n; }
      }
      out[i] = v;
      i++;
    }
    rows.push(out);
  }
  return rows;
}

function detect(rows, fileName) {
  const head = (rows[0] || []).map(h => String(h ?? '').trim());
  const find = name => head.findIndex(h => h.toLowerCase() === name.toLowerCase());
  const artI = head.findIndex(h => /ртикул/i.test(h));
  if (artI < 0) throw new Error(`«${fileName}»: нет столбца с артикулом`);
  if (find('Сумма заказов') >= 0) {
    const need = ['Заказано', 'Сумма заказов', 'Заказано (завершенные)', 'Выкуплено из заказанного (завершенные)'];
    const idx = need.map(find);
    const miss = need.filter((n, k) => idx[k] < 0);
    if (miss.length) throw new Error(`«${fileName}»: нет столбцов ${miss.join(', ')}`);
    const o = {};
    let sum = 0, cnt = 0;
    rows.slice(1).forEach(r => {
      const a = r[artI] == null ? '' : String(r[artI]).trim(); if (!a) return;
      const v = idx.map(k => num(r[k]));
      if (!v.some(x => x)) return;
      const cur = o[a] || [0, 0, 0, 0];
      o[a] = cur.map((x, k) => Math.round((x + v[k]) * 100) / 100);
      sum += v[1]; cnt++;
    });
    return {kind: 'o', name: fileName, data: o, rows: cnt, sum, label: 'Общий отчет (заказы)'};
  }
  if (find('Прибыль, руб') >= 0) {
    const need = ['Сумма продаж, руб', 'Продано, шт', 'Себестоимость, руб', 'Прибыль, руб', 'Маржинальная прибыль, руб'];
    const idx = need.map(find);
    const miss = need.filter((n, k) => idx[k] < 0);
    if (miss.length) throw new Error(`«${fileName}»: нет столбцов ${miss.join(', ')}`);
    const p = {};
    let sum = 0, cnt = 0;
    rows.slice(1).forEach(r => {
      const a = r[artI] == null ? '' : String(r[artI]).trim(); if (!a) return;
      const v = idx.map(k => num(r[k]));
      if (!v.some(x => x)) return;
      const cur = p[a] || [0, 0, 0, 0, 0];
      p[a] = cur.map((x, k) => Math.round((x + v[k]) * 100) / 100);
      sum += v[3]; cnt++;
    });
    return {kind: 'p', name: fileName, data: p, rows: cnt, sum, label: 'Unit экономика (P&L)'};
  }
  throw new Error(`«${fileName}»: не похоже ни на «Общий отчет», ни на «Unit экономику»`);
}

async function handleFiles(list) {
  const files = Array.from(list || []);
  if (!files.length) return;
  S.up.msg = {t: 'info', html: 'Читаю файлы…'};
  renderUpload();
  const errs = [];
  for (const f of files) {
    try {
      if (/\.json$/i.test(f.name)) { errs.push(`«${f.name}»: это файл экспорта, его импортируют на вкладке «План месяца»`); continue; }
      const rows = await readXlsx(f);
      const d = detect(rows, f.name);
      S.up.parsed[d.kind] = d;
    } catch (e) { errs.push(e.message); }
  }
  S.up.msg = errs.length ? {t: 'err', html: errs.map(esc).join('<br>')} : null;
  renderUpload();
}

function renderUpload() {
  const el = $('#tab-upload');
  if (!MD) return noMonth(el);
  const md = MD;
  if (!S.up.period || !md.per.some(p => p.id === S.up.period)) {
    const firstEmpty = md.per.find(p => !md.F[p.id]);
    S.up.period = (firstEmpty || md.per[md.per.length - 1]).id;
  }
  const per = md.per.find(p => p.id === S.up.period);
  const exists = !!md.F[per.id];
  const planArts = new Set(md.rows.map(r => r.art));
  const card = d => {
    if (!d) return '';
    const keys = Object.keys(d.data);
    const hit = keys.filter(k => planArts.has(k)).length;
    return `<div class="card"><b>${esc(d.label)}</b><div class="hint">${esc(d.name)}</div>
      <div class="base"><div><b>${R(d.rows)}</b><span>строк с данными</span></div>
      <div><b>${MN(d.sum)} ₽</b><span>${d.kind === 'o' ? 'сумма заказов' : 'чистая прибыль'}</span></div>
      <div><b>${hit} из ${planArts.size}</b><span>артикулов плана найдено</span></div></div></div>`;
  };
  const o = S.up.parsed.o, p = S.up.parsed.p;
  const missing = o ? [...planArts].filter(a => !(a in o.data) && !(p && a in p.data)) : [];
  const canSave = o || p;
  const loadedList = md.per.filter(x => md.F[x.id]).map(x => {
    const f = md.F[x.id];
    const sumO = Object.values(f.o || {}).reduce((s, v) => s + (v[1] || 0), 0);
    const sumP = Object.values(f.p || {}).reduce((s, v) => s + (v[3] || 0), 0);
    const conf = S.up.confirmDel === x.id;
    return `<div class="li"><b>${x.label}</b><span class="grow hint">заказы ${MN(sumO)} ₽ · ЧП ${MN(sumP)} ₽${f.uploadedAt ? ' · загружено ' + new Date(f.uploadedAt).toLocaleString('ru-RU', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'}) : ''}</span>
      <button type="button" class="btn danger" data-del="${x.id}">${conf ? 'Точно удалить?' : 'Удалить'}</button></div>`;
  }).join('') || '<span class="hint">Пока ничего не загружено.</span>';
  el.innerHTML = `
    <div class="bar">
      <label class="ctl" for="upPeriod">Период</label>
      <select id="upPeriod">${md.per.map(x => `<option value="${x.id}"${x.id === per.id ? ' selected' : ''}>${x.label}${md.F[x.id] ? ' — загружен' : ''}</option>`).join('')}</select>
      <span class="hint">${monthLabel(md.mid)}</span>
    </div>
    <label class="drop" id="drop" for="upFiles">
      <b>Перетащите сюда две выгрузки за период</b><br>
      <span class="hint">«Общий отчет» (заказы) и «Unit экономика» (P&L) в формате .xlsx, можно сразу оба. Файлы читаются в браузере.</span>
    </label>
    <input type="file" id="upFiles" accept=".xlsx" multiple hidden>
    ${S.up.msg ? `<div class="msg ${S.up.msg.t}">${S.up.msg.html}</div>` : ''}
    <div class="files">${card(o)}${card(p)}</div>
    ${o && missing.length ? `<p class="hint">Нет в выгрузке (${missing.length}): ${esc(missing.slice(0, 15).join(', '))}${missing.length > 15 ? '…' : ''}</p>` : ''}
    ${canSave ? `<div class="bar" style="margin-top:12px">
      <button type="button" class="btn primary" id="upSave">${exists ? 'Заменить данные' : 'Сохранить'} за ${per.label}</button>
      <button type="button" class="btn" id="upClear">Очистить</button>
      ${exists ? '<span class="hint">За этот период данные уже есть, они будут заменены' + (!o || !p ? ' (файл, который вы не загрузили, останется прежним)' : '') + '.</span>' : (!o || !p ? `<span class="hint">Нет файла «${!o ? 'Общий отчет' : 'Unit экономика'}»: можно сохранить сейчас и добавить его позже.</span>` : '')}
    </div>` : ''}
    <h2>Загружено за ${monthLabel(md.mid).toLowerCase()}</h2>
    <div class="list">${loadedList}</div>`;
}

async function saveUpload() {
  const md = MD, per = md.per.find(p => p.id === S.up.period);
  const id = md.mid + '_' + per.id;
  const prev = S.facts[id] || {};
  const doc = {month: md.mid, period: per.id, from: per.from, to: per.to,
    o: S.up.parsed.o ? S.up.parsed.o.data : (prev.o || {}),
    p: S.up.parsed.p ? S.up.parsed.p.data : (prev.p || {}),
    files: [S.up.parsed.o ? S.up.parsed.o.name : (prev.files || [])[0], S.up.parsed.p ? S.up.parsed.p.name : (prev.files || [])[1]].filter(Boolean),
    uploadedAt: new Date().toISOString()};
  const btn = $('#upSave'); if (btn) { btn.disabled = true; btn.textContent = 'Сохраняю…'; }
  try {
    await Backend.saveFact(id, doc);
    S.facts[id] = doc;
    S.up.parsed = {};
    S.up.msg = {t: 'ok', html: `Сохранено: ${per.label}. Трекер уже пересчитан.`};
    recompute(); pushHistory();
  } catch (e) {
    S.up.msg = {t: 'err', html: 'Не сохранилось: ' + esc(e.message) + '. Проверьте интернет и нажмите ещё раз.'};
  }
  renderAll();
}

/* ============ экспорт / импорт ============ */
function exportJson() {
  const data = {app: 'ozon-plan', version: 1, exportedAt: new Date().toISOString(), months: S.months, facts: S.facts, catalog: S.catalog || undefined};
  const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ozon-plan-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

async function importJson(file) {
  try {
    const data = JSON.parse(await file.text());
    if (!data || typeof data !== 'object' || (!data.months && !data.facts && !data.catalog)) throw new Error('в файле нет месяцев, факта и настроек');
    S.cat.msg = {t: 'info', html: 'Импортирую…'}; renderSettings();
    await Backend.importAll(data);
    Object.assign(S.months, data.months || {});
    Object.assign(S.facts, data.facts || {});
    if (data.catalog) { S.catalog = data.catalog; S.cat.draft = null; S.cat.dirty = false; }
    const ids = Object.keys(data.months || {}).sort();
    if (ids.length) S.mid = ids[ids.length - 1];
    S.dirty = false; S.draft = null;
    S.cat.msg = {t: 'ok', html: `Импортировано: месяцев ${Object.keys(data.months || {}).length}, периодов факта ${Object.keys(data.facts || {}).length}${data.catalog ? ', настройки артикулов' : ''}.`};
    pushHistory();
  } catch (e) {
    S.cat.msg = {t: 'err', html: 'Не удалось импортировать: ' + esc(e.message)};
  }
  renderAll();
}

document.addEventListener('click', async e => {

  if (!S.loaded && !b.matches('#tabs button, #modeSeg button')) return;
  if (b.matches('#tabs button')) { S.tab = b.dataset.tab; pref.set('tab', S.tab); S.planMsg = null; S.up.msg = null; S.up.confirmDel = null; S.cat.msg = null; renderAll(); return; }
  if (S.tab === 'settings' && settingsClick(b)) return;

  if (b.id === 'expAll') { MD.cats.forEach(c => S.open.add(c.key)); pref.set('open', [...S.open]); renderTracker(); return; }
  if (b.id === 'colAll') { S.open.clear(); pref.set('open', []); renderTracker(); return; }
  if (b.id === 'simReset') { S.sim.sc = null; renderSim(); return; }
  if (b.id === 'planSave') {
    b.disabled = true; b.textContent = 'Сохраняю…';
    if (await saveMonthDoc(S.mid, S.draft, 'План сохранён.')) { S.dirty = false; }
    renderAll(); return;
  }
  if (b.id === 'planUndo') { S.dirty = false; S.draft = null; S.planMsg = null; renderPlan(); return; }
  if (b.id === 'plCancel') { S.pl = {month: S.pl ? S.pl.month : S.mid}; S.planMsg = null; renderPlan(); return; }
  if (b.id === 'plOut') {
    try { await exportPlanXlsx(S.mid); } catch (err) { S.planMsg = {t: 'err', html: 'Не удалось выгрузить: ' + esc(err.message)}; renderPlan(); }
    return;
  }
  if (b.id === 'plSave') {
    const mid = S.pl.month;
    if (!/^\d{4}-\d{2}$/.test(mid)) { S.planMsg = {t: 'err', html: 'Выберите месяц.'}; renderPlan(); return; }
    b.disabled = true; b.textContent = 'Сохраняю…';
    let added = 0;
    try { added = await addToCatalog(S.pl.parsed.fresh || []); }
    catch (err) { S.planMsg = {t: 'err', html: 'Не сохранились настройки: ' + esc(err.message)}; renderPlan(); return; }
    const doc = buildPlanDoc(S.pl.parsed, mid);
    if (await saveMonthDoc(mid, doc, `План ${monthLabel(mid).toLowerCase()} сохранён: ${S.pl.parsed.rows.length} артикулов из файла.` + (added ? ` В настройки добавлено новых артикулов: ${added}.` : ''))) {
      S.mid = mid; pref.set('mid', mid); S.dirty = false; S.draft = null; S.pl = {month: mid};
    }
    renderAll(); return;
  }
  if (b.id === 'mkCopy') {
    const id = $('#newMonth').value;
    if (!/^\d{4}-\d{2}$/.test(id)) { S.planMsg = {t: 'err', html: 'Выберите месяц.'}; renderPlan(); return; }
    if (S.months[id]) { S.planMsg = {t: 'err', html: `${monthLabel(id)} уже есть. Выберите его в списке месяцев сверху.`}; renderPlan(); return; }
    const doc = clone(S.months[S.mid]);
    delete doc.updatedAt; doc.copiedFrom = S.mid;
    if (await saveMonthDoc(id, doc, `${monthLabel(id)} создан.`)) { S.mid = id; pref.set('mid', id); S.dirty = false; S.draft = null; }
    renderAll(); return;
  }
  if (b.id === 'mkEmpty') {
    const id = $('#newMonth').value;
    if (!/^\d{4}-\d{2}$/.test(id)) { S.planMsg = {t: 'err', html: 'Выберите месяц.'}; renderPlan(); return; }
    if (S.months[id]) { S.planMsg = {t: 'err', html: `${monthLabel(id)} уже есть. Выберите его в списке месяцев сверху.`}; renderPlan(); return; }
    const src = S.mid && S.months[S.mid] ? S.months[S.mid] : {};
    const doc = syncDraft({cabinets: [], categories: (src.categories || []).map(c => ({cab: c.cab, cat: c.cat, min: c.min ?? null, norm: c.norm ?? null, st: c.st ?? null})), plan: []});
    if (!doc.plan.length) { S.planMsg = {t: 'err', html: 'В «Настройках» нет ни одного артикула на ведении — сначала добавьте их там.'}; renderPlan(); return; }
    if (await saveMonthDoc(id, doc, `${monthLabel(id)} создан: ${doc.plan.length} артикулов, впишите цену и план в штуках.`)) { S.mid = id; pref.set('mid', id); S.dirty = false; S.draft = null; }
    renderAll(); return;
  }
  if (b.id === 'expJson') { exportJson(); return; }
  if (b.id === 'ghSetup') { if ((S.dirty || S.cat.dirty) && !confirm('Есть несохранённые правки. Перейти к ключу?')) return; showSetup(); return; }
  if (b.id === 'upSave') { saveUpload(); return; }
  if (b.id === 'upClear') { S.up.parsed = {}; S.up.msg = null; renderUpload(); return; }
  if (b.dataset.del) {
    const pid = b.dataset.del;
    if (S.up.confirmDel !== pid) { S.up.confirmDel = pid; renderUpload(); return; }
    S.up.confirmDel = null;
    const id = MD.mid + '_' + pid;
    try { await Backend.deleteFact(id); delete S.facts[id]; S.up.msg = {t: 'ok', html: 'Данные периода удалены.'}; pushHistory(); }
    catch (err) { S.up.msg = {t: 'err', html: 'Не удалилось: ' + esc(err.message)}; }
    renderAll(); return;
  }
});

    else { const r = $(t.dataset.f === 'qty' ? '#scqr' + i : '#scrr' + i); if (r) r.value = Math.round(v); }

      S.draft.plan.forEach((r, j) => {

        const inp = document.querySelector(`input[data-k="p.${j}.${field}"]`);
        if (inp) { inp.value = ''; inp.placeholder = pctIn(v); }

    planCalc();
    planSetDirty();
  }
});

/* ============ обновления сайта: кнопка вместо захода на GitHub ============ */
// Правки приходят pull request'ами в репозиторий кода. Сайт показывает открытые PR, статус автопроверки
// и ставит обновление кнопкой (merge через GitHub API), потом ждёт публикации и перезагружается.
const CODE_REPO = 'vladoskosolapovv/ozon-plan';
const BUILD = '__BUILD__'; // при публикации сюда подставляется sha коммита
const isBuild = v => /^[0-9a-f]{40}$/.test(v || '');
const Upd = {list: [], state: null, msg: null, newer: null, last: 0, timer: null};

async function ghApi(path, opt = {}) {
  const r = await fetch('https://api.github.com' + path, {
    method: opt.method || 'GET', cache: 'no-store',
    headers: Object.assign({Accept: 'application/vnd.github+json'}, ghConf.token ? {Authorization: 'Bearer ' + ghConf.token} : {}, opt.body ? {'Content-Type': 'application/json'} : {}),
    body: opt.body ? JSON.stringify(opt.body) : undefined
  });
  const j = r.status === 204 ? null : await r.json().catch(() => null);
  if (!r.ok) { const e = new Error((j && j.message) || ('GitHub ответил ' + r.status)); e.status = r.status; throw e; }
  return j;
}

async function checkRun(sha, event) {
  try {
    const j = await ghApi(`/repos/${CODE_REPO}/actions/runs?head_sha=${sha}&per_page=10`);
    const runs = (j.workflow_runs || []).filter(x => !event || x.event === event);
    const r = runs[0];
    if (!r) return {st: 'none'};
    if (r.status !== 'completed') return {st: 'pending', url: r.html_url};
    return {st: r.conclusion === 'success' ? 'ok' : 'fail', url: r.html_url};
  } catch (e) { return {st: 'unknown'}; }
}

async function checkUpdates() {
  if (!ghConf.token || Upd.state) return;
  Upd.last = Date.now();
  try {
    const prs = await ghApi(`/repos/${CODE_REPO}/pulls?state=open&base=main&per_page=10`);
    const list = [];
    for (const pr of prs) {
      if (pr.draft) continue;
      const ch = await checkRun(pr.head.sha, 'pull_request');
      list.push({n: pr.number, title: pr.title, body: pr.body || '', url: pr.html_url, sha: pr.head.sha, check: ch.st, runUrl: ch.url});
    }
    Upd.list = list.sort((a, b) => a.n - b.n);
  } catch (e) { Upd.list = []; }
  // страница из кэша браузера старее опубликованной версии
  if (location.protocol !== 'file:') try {
    const v = await fetch('version.json?t=' + Date.now(), {cache: 'no-store'}).then(r => r.ok ? r.json() : null);
    Upd.newer = v && isBuild(v.sha) && isBuild(BUILD) && v.sha !== BUILD ? v.sha : null;
  } catch (e) { Upd.newer = null; }
  renderUpd();
  clearTimeout(Upd.timer);
  if (Upd.list.some(x => x.check === 'pending')) Upd.timer = setTimeout(checkUpdates, 20000);
}

// короткое «что нового» из описания PR: заголовки, пункты, жирный
function notesHtml(md) {
  const lines = String(md).split('\n').map(l => l.trim()).filter(l => l && !/^🤖|^https?:\/\/claude\.ai|Generated with/.test(l));
  let out = '', inList = false;
  const inline = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`(.+?)`/g, '<code>$1</code>');
  lines.forEach(l => {
    const li = l.match(/^[-*]\s+(.*)$/);
    if (li) { if (!inList) { out += '<ul class="notes">'; inList = true; } out += '<li>' + inline(li[1]) + '</li>'; return; }
    if (inList) { out += '</ul>'; inList = false; }
    out += '<p>' + inline(l.replace(/^#+\s*/, '')) + '</p>';
  });
  return out + (inList ? '</ul>' : '');
}

function renderUpd() {
  const el = $('#upd'); if (!el) return;
  let h = '';
  if (Upd.msg) h += `<div class="upd ${Upd.msg.t === 'err' ? 'err' : 'done'}"><span>${Upd.msg.html}</span><span class="spacer"></span><button type="button" class="linkbtn" id="updHide">скрыть</button></div>`;
  if (Upd.state) {
    const s = Upd.state, sec = Math.round((Date.now() - s.t0) / 1000);
    h += `<div class="upd"><span class="spin" aria-hidden="true"></span><span class="ttl">Устанавливаю обновление «${esc(s.title)}»</span>
      <span class="st">${esc(s.stage)} · ${sec} с. Обычно 1–3 минуты, страница перезагрузится сама.</span></div>`;
  } else if (Upd.newer) {
    h += `<div class="upd"><span class="ttl">Вышла новая версия сайта</span><span class="spacer"></span><button type="button" class="btn primary" id="updReload">Перезагрузить</button></div>`;
  }
  if (!Upd.state) Upd.list.forEach(u => {
    const st = u.check === 'ok' ? '<span class="st ok">✓ проверка пройдена</span>'
      : u.check === 'pending' ? '<span class="st"><span class="spin" aria-hidden="true"></span> идёт проверка…</span>'
      : u.check === 'fail' ? '<span class="st bad">✕ проверка не прошла — ставить нельзя</span>'
      : '<span class="st">проверка не найдена</span>';
    h += `<div class="upd"><span class="ttl">Доступно обновление: ${esc(u.title)}</span>${st}<span class="spacer"></span>
      <a class="st" href="${esc(u.url)}" target="_blank" rel="noopener">на GitHub</a>
      <button type="button" class="btn primary" data-install="${u.n}"${u.check === 'ok' ? '' : ' disabled'}>Установить</button>
      ${u.body ? `<details><summary>Что нового</summary>${notesHtml(u.body)}</details>` : ''}</div>`;
  });
  el.innerHTML = h;
}

function updError(e) {
  if (e.status === 403 || e.status === 404) return `Ключу этого устройства не хватает прав на обновление сайта. На GitHub откройте
    <a href="https://github.com/settings/personal-access-tokens" target="_blank" rel="noopener">свои ключи</a> → ваш ключ → <b>Edit</b>:
    в Repository access добавьте <b>${esc(CODE_REPO.split('/')[1])}</b>, в Permissions выберите <b>Contents</b> и <b>Pull requests</b> → Read and write → <b>Update</b>.
    Ключ останется тем же, вводить заново не нужно. Потом нажмите «Установить» ещё раз.`;
  if (e.status === 405) return 'Это обновление сейчас нельзя установить: ' + esc(e.message) + '. Напишите Claude, он поправит.';
  if (e.status === 409) return 'Обновление изменилось, пока вы смотрели. Список обновлён — нажмите «Установить» ещё раз.';
  return 'Не получилось установить: ' + esc(e.message);
}

async function installUpdate(n) {
  const u = Upd.list.find(x => x.n === n); if (!u) return;
  if ((S.dirty || S.cat.dirty) && !confirm('Есть несохранённые правки — после обновления страница перезагрузится и они пропадут. Продолжить?')) return;
  Upd.msg = null;
  Upd.state = {n, title: u.title, stage: 'Применяю изменения', t0: Date.now()};
  renderUpd();
  let sha;
  try {
    const r = await ghApi(`/repos/${CODE_REPO}/pulls/${n}/merge`, {method: 'PUT', body: {merge_method: 'squash', sha: u.sha}});
    sha = r.sha;
  } catch (e) {
    Upd.state = null; Upd.msg = {t: 'err', html: updError(e)};
    if (e.status === 409) { Upd.list = []; checkUpdates(); }
    renderUpd(); return;
  }
  Upd.state.stage = 'Проверка и публикация';
  const tick = setInterval(renderUpd, 1000);
  const deadline = Date.now() + 8 * 60 * 1000;
  while (Date.now() < deadline) {
    await new Promise(r => setTimeout(r, 7000));
    try {
      const v = await fetch('version.json?t=' + Date.now(), {cache: 'no-store'}).then(r => r.ok ? r.json() : null);
      if (v && v.sha === sha) {
        clearInterval(tick);
        Upd.state.stage = 'Готово, перезагружаю';
        renderUpd();
        setTimeout(() => { location.href = location.pathname + '?v=' + sha.slice(0, 7); }, 800);
        return;
      }
    } catch (e) {}
    const run = await checkRun(sha, 'push');
    if (run.st === 'fail') {
      clearInterval(tick);
      Upd.state = null;
      Upd.msg = {t: 'err', html: `Изменения приняты, но публикация не прошла — сайт остался прежним. <a href="${esc(run.url || '#')}" target="_blank" rel="noopener">Подробности</a>. Напишите Claude, он поправит.`};
      renderUpd(); return;
    }
    Upd.state.stage = run.st === 'pending' ? 'Проверка и публикация' : 'Жду, пока GitHub опубликует сайт';
  }
  clearInterval(tick);
  Upd.state = null;
  Upd.msg = {t: 'err', html: 'Публикация идёт дольше обычного. Обновите страницу через пару минут.'};
  renderUpd();
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.install) { e.stopPropagation(); installUpdate(+b.dataset.install); }
  else if (b.id === 'updReload') { e.stopPropagation(); location.href = location.pathname + '?v=' + (Upd.newer || '').slice(0, 7); }
  else if (b.id === 'updHide') { e.stopPropagation(); Upd.msg = null; renderUpd(); }
}, true);
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - Upd.last > 5 * 60 * 1000) checkUpdates(); });

/* ============ старт ============ */
function hideTabs() { ['tracker', 'sim', 'history', 'plan', 'upload', 'settings'].forEach(t => { $('#tab-' + t).hidden = true; }); }

function showLoadProblem(text, withSetup) {
  hideTabs();
  $('#status').innerHTML = `<div class="msg err" style="width:100%">${text}
    <div class="bar" style="margin:10px 0 0"><button type="button" class="btn" id="retryLoad">Повторить</button>
    ${withSetup ? '<button type="button" class="btn" id="ghSetup">Ввести другой ключ</button>' : ''}</div></div>`;
}

function showSetup(errText) {
  S.loaded = false;
  hideTabs();
  const repo = ghConf.repo;
  $('#status').innerHTML = `<div class="card setup">
    <h2>Подключение к хранилищу данных</h2>
    <p style="margin:0">План и факт хранятся в вашем приватном репозитории GitHub <b>${esc(repo)}</b>. На каждом устройстве ключ вводится один раз, дальше сайт открывается сразу.</p>
    ${errText ? `<div class="msg err">${errText}</div>` : ''}
    <ol>
      <li>Откройте <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">создание ключа на GitHub</a> (вход под аккаунтом владельца репозитория).</li>
      <li><b>Token name</b> — любое, например «План продаж, ноутбук». <b>Expiration</b> — самый долгий срок из предложенных.</li>
      <li><b>Repository access</b> → Only select repositories → выберите <b>${esc(repo.split('/')[1] || repo)}</b> и <b>${esc(CODE_REPO.split('/')[1])}</b> (второй нужен для кнопки обновления сайта).</li>
      <li><b>Permissions</b> → Repository permissions → <b>Contents</b> → Read and write, <b>Pull requests</b> → Read and write.</li>
      <li>Нажмите <b>Generate token</b>, скопируйте ключ (начинается с github_pat_) и вставьте сюда.</li>
    </ol>
    <div class="bar">
      <input id="ghToken" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…" aria-label="Ключ GitHub" style="flex:2 1 260px">
      <input id="ghRepo" type="text" value="${esc(repo)}" spellcheck="false" aria-label="Репозиторий данных" style="flex:1 1 200px">
      <button type="button" class="btn primary" id="ghConnect">Подключить</button>
    </div>
    <p class="hint" style="margin:0">Ключ хранится только в этом браузере и даёт доступ только к репозиторию данных.
      Можно <button type="button" class="linkbtn" id="ghLocal">открыть без подключения</button> — тогда данные будут только в этом браузере.</p>
  </div>`;
  const inp = $('#ghToken'); if (inp) inp.focus();
}

const withTimeout = (p, ms) => {
  let t;
  return Promise.race([p, new Promise((_, rej) => { t = setTimeout(() => rej(new Error('timeout')), ms); })]).finally(() => clearTimeout(t));
};

async function start() {
  S.loaded = false; S.error = null;
  if (!pickBackend()) { showSetup(); return; }
  const t0 = Date.now();
  let stage = Backend.kind === 'github' ? 'Подключаюсь к GitHub' : 'Открываю данные браузера';
  const tick = setInterval(() => {
    if (S.loaded) return;
    $('#status').innerHTML = `<span class="pill"><span class="dot"></span>${stage}… ${Math.round((Date.now() - t0) / 1000)} с</span>`;
  }, 400);
  try {
    try { await withTimeout(Backend.ping(), 20000); }
    catch (e) {
      clearInterval(tick);
      if (e.message === 'timeout') showLoadProblem('GitHub не ответил за 20 секунд. Проверьте интернет и нажмите «Повторить».');
      else if (e.status === 401 || e.status === 404 || e.status === 403) showSetup(esc(e.message));
      else showLoadProblem('Не удалось подключиться: ' + esc(String(e.message || e)) + (e instanceof TypeError ? '. Похоже, нет интернета.' : ''));
      return;
    }
    stage = 'Загружаю данные';
    const data = await withTimeout(Backend.load((d, n) => { stage = `Загружаю данные: ${d} из ${n} файлов`; }), 90000);
    S.months = data.months || {}; S.facts = data.facts || {}; S.catalog = data.catalog || null;
    S.loaded = true;
  } catch (e) {
    clearInterval(tick);
    showLoadProblem(e.message === 'timeout'
      ? 'Данные не загрузились за полторы минуты. Нажмите «Повторить».'
      : `Не удалось загрузить данные: ${esc(String(e.message || e))}`, e.status === 401 || e.status === 403);
    return;
  }
  clearInterval(tick);
  if (S.mid && !S.months[S.mid]) S.mid = null;
  if (!Object.keys(S.months).length && S.tab !== 'plan') S.tab = 'plan';
  renderAll();
  console.log('Данные загружены за', Date.now() - t0, 'мс');
  checkUpdates();
}

async function connectGitHub() {
  const token = ($('#ghToken').value || '').trim();
  const repo = ($('#ghRepo').value || '').trim().replace(/^https?:\/\/github\.com\//, '').replace(/\.git$/, '').replace(/\/$/, '');
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { showSetup('Репозиторий пишется как владелец/название, например ' + esc(GH_DEFAULT_REPO) + '.'); return; }
  if (!/^(github_pat_|ghp_)\w{20,}$/.test(token)) { showSetup('Это не похоже на ключ GitHub: он начинается с github_pat_ и вставляется целиком.'); return; }
  const prev = {t: ghConf.token, r: ghConf.repo};
  ghConf.save(token, repo);
  const btn = $('#ghConnect'); if (btn) { btn.disabled = true; btn.textContent = 'Проверяю…'; }
  try {
    const r = await fetch('https://api.github.com/repos/' + repo, {cache: 'no-store', headers: {Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json'}});
    const j = await r.json().catch(() => null);
    if (!r.ok) throw Object.assign(new Error(ghError(r.status, j)), {status: r.status});
    if (j.permissions && !j.permissions.push) throw new Error('у ключа нет права записи: в Permissions → Contents выберите Read and write');
    if (!j.private) throw new Error(`репозиторий ${repo} публичный — данные увидят все. Сделайте его приватным (Settings → Danger Zone → Change visibility) и подключите снова`);
  } catch (e) {
    if (prev.t) ghConf.save(prev.t, prev.r); else ghConf.forget();
    showSetup('Не подключилось: ' + esc(e.message));
    $('#ghRepo').value = repo;
    return;
  }
  start();
}

document.addEventListener('click', e => {
  const id = e.target.id;
  if (id === 'retryLoad') { e.stopPropagation(); start(); }
  else if (id === 'ghConnect') { e.stopPropagation(); connectGitHub(); }
  else if (id === 'ghLocal') { e.stopPropagation(); ghConf.setLocal(true); start(); }
  else if (id === 'ghSetup' && !S.loaded) { e.stopPropagation(); showSetup(); }
}, true);
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'ghToken') connectGitHub(); });
start();
</script>
