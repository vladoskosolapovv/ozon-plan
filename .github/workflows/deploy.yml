name: Деплой в Google Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.clasp.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_ID: AKfycbxe9JT1edW3Lj3BR2Q8YMGTw0MKBDmkRyKSr26QPWnMXpa1qtQ2Gq6VwDFjA-aXfjzCVQ
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установить clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Доступ к Google
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "Нет секрета CLASPRC_JSON"; exit 1; fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Залить код в проект
        run: |
          set -o pipefail
          if ! clasp push --force 2>&1 | tee push.log; then
            echo "::error title=clasp push::$(tr '\n' ' ' < push.log | cut -c1-900)"
            exit 1
          fi

      - name: Обновить веб-приложение (ссылка не меняется)
        run: |
          MSG="$(git log -1 --pretty=%s | cut -c1-90)"
          set -o pipefail
          if ! clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "${GITHUB_SHA::7} ${MSG}" 2>&1 | tee deploy.log; then
            echo "::error title=clasp deploy::$(tr '\n' ' ' < deploy.log | cut -c1-900)"
            exit 1
          fi
          echo "::notice title=Готово::$(tr '\n' ' ' < deploy.log | cut -c1-300)"
