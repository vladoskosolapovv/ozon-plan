<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>План продаж Ozon</title>
<script>
window.__earlyErrors = [];
window.addEventListener('error', function (e) {
  var t = (e.message || 'ошибка') + (e.lineno ? ' (строка ' + e.lineno + ', столбец ' + e.colno + ')' : '');
  window.__earlyErrors.push(t);
  var el = document.getElementById('status');
  if (el) el.innerHTML = '<div class="msg err" style="width:100%">Ошибка на странице: ' + t.replace(/[&<>]/g, '') + '</div>';
});
document.addEventListener('DOMContentLoaded', function () {
  var el = document.getElementById('status');
  if (el && window.__earlyErrors.length) el.innerHTML = '<div class="msg err" style="width:100%">Ошибка на странице: ' + window.__earlyErrors.join('; ').replace(/[&<>]/g, '') + '</div>';
});
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: sticky header with tabs, one working area per tab; tables scroll inside their own box. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --surface-2:#f7f8fb; --ink:#141821; --muted:#5d6676; --line:#e2e5ec;
  --accent:#2c49d6; --accent-soft:#e6eafc;
  --good:#17804f; --good-bg:#dcf2e6; --warn:#9a6410; --warn-bg:#fbeed3; --bad:#b93a24; --bad-bg:#fbe0d9;
  --sa:#2c49d6; --sb:#c0562b; --sc:#16806e;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1218; --surface:#171b23; --surface-2:#1c212b; --ink:#e7eaf0; --muted:#97a0b0; --line:#2a303b;
    --accent:#8197ff; --accent-soft:#232c52;
    --good:#56c993; --good-bg:#16332a; --warn:#e2b25a; --warn-bg:#382c13; --bad:#f2846c; --bad-bg:#3d201a;
    --sa:#8197ff; --sb:#f0905f; --sc:#4cc9b0;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
.wrap{max-width:1440px;margin:0 auto;padding-inline:16px}

header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .row1{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font:600 18px/1.1 var(--f-display);letter-spacing:-.01em;margin:0}
.brand .tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ctl{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
select,input[type=text],input[type=password],input[type=number],input[type=month],input[type=search],textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-width:0}
select:focus,input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 11px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.tabs{display:flex;gap:2px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.status{font-size:12.5px;color:var(--muted);padding-block:10px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.status .pill{display:inline-flex;gap:6px;align-items:center}
#upd:empty{display:none}
#upd{padding-top:10px}
.upd{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:10px 14px;font-size:13.5px;color:var(--ink)}
.upd + .upd{margin-top:8px}
.upd .ttl{font-weight:600}
.upd .st{font-size:12.5px;color:var(--muted)}
.upd .st.ok{color:var(--good)} .upd .st.bad{color:var(--bad)}
.upd details{flex-basis:100%;font-size:13px}
.upd details summary{cursor:pointer;color:var(--accent)}
.upd .notes{margin:6px 0 0;padding-left:18px;line-height:1.55;max-width:90ch}
.upd .notes p{margin:6px 0 2px;font-weight:600}
.upd.err{background:var(--bad-bg);border-color:var(--bad)}
.upd.done{background:var(--good-bg);border-color:var(--good)}
.spin{width:14px;height:14px;border:2px solid var(--accent);border-right-color:transparent;border-radius:50%;display:inline-block;animation:spin .8s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.ok{background:var(--good)} .dot.off{background:var(--warn)}

main{padding-block:4px 48px}
section[hidden]{display:none!important}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 13px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-block:8px 14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip .nd{font-size:11px;color:var(--muted)}
.chip.on .nd{color:inherit;opacity:.7}
.spacer{flex:1}
h2{font:600 15px/1.2 var(--f-display);margin:22px 0 10px;letter-spacing:-.005em}
.hint{color:var(--muted);font-size:12.5px;max-width:78ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.setup{width:100%;font-size:14px;color:var(--ink);max-width:860px}
.setup h2{font-family:var(--f-display);font-size:17px;font-weight:600;margin:2px 0 8px}
.setup ol{padding-left:20px;margin:10px 0;line-height:1.65;font-size:13.5px;max-width:none}
.setup a{color:var(--accent)}
.setup .bar input{min-width:0}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit}

/* KPI tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .lbl{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile .big{font:600 23px/1.15 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tile .sub{font-size:12.5px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:4px;position:relative}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.good{background:var(--good)} .meter i.warn{background:var(--warn)} .meter i.bad{background:var(--bad)}

.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.mover{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 12px;align-items:center;font-size:13px}
.mover .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mover .nm small{color:var(--muted)}

/* states */
.st{display:inline-block;min-width:46px;text-align:center;padding:1px 7px;border-radius:5px;font-weight:600;font-size:12.5px}
.st.good{background:var(--good-bg);color:var(--good)} .st.warn{background:var(--warn-bg);color:var(--warn)} .st.bad{background:var(--bad-bg);color:var(--bad)}
.st.none{color:var(--muted);font-weight:400}
.neg{color:var(--bad)} .pos{color:var(--good)}

/* main table */
.tbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:calc(100vh - 220px)}
table.t{border-collapse:separate;border-spacing:0;width:100%;min-width:980px;font-size:13px}
table.t th{position:sticky;top:0;background:var(--surface-2);z-index:2;font-weight:600;font-size:12px;color:var(--muted);text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left;position:sticky;left:0;z-index:1;background:inherit}
table.t th:first-child{z-index:3;background:var(--surface-2)}
table.t td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;background:var(--surface)}
table.t tr.total td{background:var(--accent-soft);font-weight:600}
table.t tr.cab td{background:var(--surface-2);font-weight:600}
table.t tr.cat td{font-weight:600;cursor:pointer}
table.t tr.cat td:first-child::before{content:"▸";display:inline-block;width:14px;color:var(--muted);transition:transform .12s}
table.t tr.cat.open td:first-child::before{transform:rotate(90deg)}
table.t tr.art td:first-child{padding-left:30px;font-weight:400;color:var(--ink)}
table.t tr.out td{color:var(--muted);font-style:italic}
table.t td .sm{display:block;font-size:11px;color:var(--muted);font-weight:400}
.nm-cell{max-width:300px;overflow:hidden;text-overflow:ellipsis}

/* simulator */
.sim-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:900px){.sim-grid{grid-template-columns:1fr}}
.sc{border-top:3px solid var(--c);}
.sc .head{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.sc .head input{font-weight:600;flex:1;border-color:transparent;background:transparent;padding-left:0}
.sc .head input:hover,.sc .head input:focus{border-color:var(--line);padding-left:9px}
.fld{display:grid;grid-template-columns:1fr 110px;gap:4px 10px;align-items:center;margin-block:8px}
.fld label{font-size:12.5px;color:var(--muted)}
.fld input[type=range]{grid-column:1/3;width:100%;accent-color:var(--c)}
.fld input[type=number]{text-align:right}
.base{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 18px;margin-top:10px}
.base div{display:flex;flex-direction:column}
.base b{font-variant-numeric:tabular-nums;font-size:15px}
.base span{font-size:11.5px;color:var(--muted)}
table.cmp{border-collapse:collapse;width:100%;font-size:13px}
table.cmp th,table.cmp td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.cmp th:first-child,table.cmp td:first-child{text-align:left;color:var(--muted)}
table.cmp th{font-size:12.5px}
table.cmp td.best{background:var(--good-bg);color:var(--good);font-weight:700}
.verdict{font-size:14px;line-height:1.55;margin:12px 0 0;max-width:90ch}
.chartbox{overflow-x:auto}
svg text{fill:var(--muted);font:11px var(--f-body)}
svg .lbl-strong{fill:var(--ink);font-weight:600}
table.mx{border-collapse:separate;border-spacing:3px;font-size:12.5px}
table.mx td,table.mx th{padding:6px 9px;text-align:right;border-radius:5px;white-space:nowrap}
table.mx th{color:var(--muted);font-weight:500}
table.mx td.me{outline:2px solid var(--ink)}

/* plan editor */
table.ed{border-collapse:collapse;width:100%;font-size:13px;min-width:860px}
table.ed th{position:sticky;top:0;z-index:2;background:var(--surface-2);text-align:right;font-size:12px;color:var(--muted);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.ed th:first-child,table.ed td:first-child{text-align:left}
table.ed tr.grp td.gl{color:var(--muted);font-weight:500;font-size:12px}
table.ed tr.grp input{background:var(--surface);font-weight:600}
table.ed .gcab{display:inline-block;font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:1px 6px;margin-right:4px}
table.ed .gn{font-weight:400;color:var(--muted);font-size:12px;margin-left:4px}
table.ed td.stc{color:var(--good)}
table.ed td.calc{color:var(--ink);font-variant-numeric:tabular-nums;min-width:90px}
table.ed td.warn-t{color:var(--warn)}
table.ed input::placeholder{color:var(--muted);opacity:.75}
table.ed.set{min-width:0}
table.ed.set td,table.ed.set th{text-align:left}
table.ed.set th:nth-child(3){width:360px} table.ed.set th:nth-child(4){width:140px} table.ed.set th:nth-child(5){width:40px}
table.ed.set td:first-child,table.ed.set th:first-child{width:28px}
table.ed.set input.catin{text-align:left;width:min(320px,100%)}
table.ed.set input.catname{text-align:left;width:auto;min-width:200px;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:3px 6px}
table.ed.set tr.offrow td{color:var(--muted)}
table.ed.set tr.offrow td:nth-child(2){text-decoration:line-through}
.onlbl{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);cursor:pointer}
.xbtn{border:0;background:none;color:var(--muted);font-size:17px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:5px}
.xbtn:hover{color:var(--bad);background:var(--bad-bg)}
.bulk{position:sticky;top:0;z-index:3;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--accent-soft);color:var(--ink);border:1px solid var(--accent);border-radius:10px;padding:8px 12px;margin-bottom:8px}
.bulk input{min-width:200px}
.addbox{margin-bottom:10px}
.freshbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 14px;max-height:300px;overflow:auto;border-top:1px solid var(--line);padding-top:8px}
.fr{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer;min-width:0}
.fr span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr .nd{color:var(--muted);font-size:11.5px;margin-left:auto;white-space:nowrap}
table.ed .unit{font-size:11px;color:var(--muted);margin-left:4px}
table.ed tr.grp input.tgt{width:130px}
table.ed tr.grp input.tgt::placeholder{color:var(--ink);opacity:.55;font-weight:600}
table.ed tr.cpart td{color:var(--muted)}
table.ed tr.cpart input:disabled{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.tag-new{font-size:11px;color:var(--warn);background:var(--warn-bg);border-radius:5px;padding:1px 6px;margin-left:4px}
table.ed td{padding:3px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.ed input{width:100%;text-align:right;padding:4px 6px}
table.ed input.w{width:110px} table.ed input.s{width:72px}
table.ed tr.grp td{background:var(--surface-2);font-weight:600;padding:7px 8px}
.edbox{max-height:62vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
textarea{width:100%;min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}

/* upload */
.drop{border:2px dashed var(--line);border-radius:12px;padding:26px 18px;text-align:center;background:var(--surface);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.files{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-top:12px}
.msg{padding:10px 14px;border-radius:8px;margin-block:10px;font-size:13.5px}
.msg.ok{background:var(--good-bg);color:var(--good)} .msg.err{background:var(--bad-bg);color:var(--bad)} .msg.info{background:var(--accent-soft);color:var(--accent)}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.li .grow{flex:1;min-width:180px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:600 16px var(--f-display);margin-bottom:6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="row1">
      <div class="brand"><h1>План продаж Ozon</h1><span class="tag">план / факт</span></div>
      <div class="ctl"><label for="monthSel">Месяц</label><select id="monthSel"></select></div>
      <div class="ctl"><span>ЧП</span>
        <div class="seg" id="modeSeg" role="group" aria-label="Какую прибыль считать">
          <button type="button" data-mode="net">чистая</button><button type="button" data-mode="margin">маржинальная</button>
        </div>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button type="button" data-tab="tracker">Трекер</button>
      <button type="button" data-tab="sim">Что выгоднее</button>
      <button type="button" data-tab="history">История</button>
      <button type="button" data-tab="plan">План месяца</button>
      <button type="button" data-tab="upload">Загрузка данных</button>
      <button type="button" data-tab="settings">Настройки</button>
    </nav>
  </div>
</header>

<div class="wrap">
  <div id="upd"></div>
  <div class="status" id="status"><span class="pill"><span class="dot"></span>Загружаю данные…</span></div>
  <main>
    <section id="tab-tracker"></section>
    <section id="tab-sim" hidden></section>
    <section id="tab-history" hidden></section>
    <section id="tab-plan" hidden></section>
    <section id="tab-upload" hidden></section>
    <section id="tab-settings" hidden></section>
  </main>
</div>

<script>
/* ============ ошибки страницы — показываем, а не молчим ============ */
function showFatal(text) {
  const el = document.getElementById('status');
  if (el) el.innerHTML = '<div class="msg err" style="width:100%">Ошибка на странице: ' + String(text).replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c])) +
    '<br>Пришлите этот текст разработчику.</div>';
}
window.addEventListener('error', e => showFatal(e.message + (e.lineno ? ' (строка ' + e.lineno + ')' : '')));
window.addEventListener('unhandledrejection', e => showFatal(e.reason && e.reason.message || e.reason));

/* ============ библиотека для xlsx: грузим только когда нужна ============ */
let jszipPromise = null;
function ensureJSZip() {
  if (typeof JSZip !== 'undefined') return Promise.resolve();
  if (jszipPromise) return jszipPromise;
  const urls = ['https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
    'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',
    'https://unpkg.com/jszip@3.10.1/dist/jszip.min.js'];
  const load = url => new Promise((res, rej) => {
    const sc = document.createElement('script');
    const t = setTimeout(() => { sc.remove(); rej(new Error('timeout')); }, 8000);
    sc.src = url; sc.async = true;
    sc.onload = () => { clearTimeout(t); typeof JSZip !== 'undefined' ? res() : rej(new Error('empty')); };
    sc.onerror = () => { clearTimeout(t); sc.remove(); rej(new Error('blocked')); };
    document.head.appendChild(sc);
  });
  jszipPromise = urls.reduce((p, u) => p.catch(() => load(u)), Promise.reject(new Error('start')))
    .catch(() => { jszipPromise = null; throw new Error('Не загрузилась библиотека чтения Excel. Проверьте интернет и попробуйте ещё раз.'); });
  return jszipPromise;
}

/* ============ утилиты ============ */
const $ = s => document.querySelector(s);
const NF = new Intl.NumberFormat('ru-RU', {maximumFractionDigits: 0});
const ok = v => v != null && isFinite(v);
const R = v => ok(v) ? NF.format(Math.round(v)) : '–';
const P = v => ok(v) ? Math.round(v * 100) + '%' : '–';
const MN = v => {
  if (!ok(v)) return '–';
  const a = Math.abs(v);
  if (a >= 1e6) return (v / 1e6).toLocaleString('ru-RU', {maximumFractionDigits: a >= 1e8 ? 0 : 2}) + ' млн';
  if (a >= 1e4) return Math.round(v / 1e3).toLocaleString('ru-RU') + ' тыс';
  return R(v);
};
const num = v => {
  if (v == null || v === '') return 0;
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  const n = parseFloat(String(v).replace(/[\s ₽%]/g, '').replace(',', '.'));
  return isFinite(n) ? n : 0;
};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const pad = n => String(n).padStart(2, '0');
const clone = o => JSON.parse(JSON.stringify(o));
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const monthLabel = id => { const [y, m] = id.split('-').map(Number); return MONTHS[m - 1] + ' ' + y; };
const pctCls = p => !ok(p) ? 'none' : p >= 1 ? 'good' : p >= 0.9 ? 'warn' : 'bad';
const rentCls = (r, c) => {
  if (!ok(r) || !c || !num(c.norm)) return 'none';
  const mn = c.min != null && c.min !== '' ? num(c.min) : num(c.norm);
  return r >= num(c.norm) ? 'good' : r >= mn ? 'warn' : 'bad';
};
const pref = {
  get(k, d) { try { const v = localStorage.getItem('ozonPlan.ui.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ozonPlan.ui.' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ============ хранилище: приватный репозиторий GitHub или браузер ============ */
// Данные лежат файлами в отдельном приватном репозитории:
//   months/2026-10.json        — план месяца

// Каждое сохранение — коммит, поэтому любая прошлая версия плана видна в истории репозитория.
const GH_DEFAULT_REPO = 'vladoskosolapovv/ozon-plan-data';
const ghConf = {
  get token() { try { return localStorage.getItem('ozonPlan.gh.token') || ''; } catch (e) { return ''; } },
  get repo() { try { return localStorage.getItem('ozonPlan.gh.repo') || GH_DEFAULT_REPO; } catch (e) { return GH_DEFAULT_REPO; } },
  get local() { try { return localStorage.getItem('ozonPlan.gh.local') === '1'; } catch (e) { return false; } },
  save(token, repo) { try { localStorage.setItem('ozonPlan.gh.token', token); localStorage.setItem('ozonPlan.gh.repo', repo); localStorage.removeItem('ozonPlan.gh.local'); } catch (e) {} },
  setLocal(on) { try { on ? localStorage.setItem('ozonPlan.gh.local', '1') : localStorage.removeItem('ozonPlan.gh.local'); } catch (e) {} },
  forget() { try { localStorage.removeItem('ozonPlan.gh.token'); } catch (e) {} }
};

const b64enc = s => {
  const bytes = new TextEncoder().encode(s);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
};
const b64dec = b => new TextDecoder().decode(Uint8Array.from(atob(String(b).replace(/\s/g, '')), c => c.charCodeAt(0)));

// кэш содержимого файлов по их sha: второй и следующие заходы грузят только изменившиеся файлы
const BlobCache = (() => {
  let dbp = null;
  const db = () => dbp || (dbp = new Promise((res, rej) => {
    try {
      const r = indexedDB.open('ozonPlanCache', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('blobs');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  }));
  const tx = (mode, fn) => db().then(d => new Promise((res, rej) => {
    const t = d.transaction('blobs', mode); const st = t.objectStore('blobs');
    const out = fn(st); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error);
  }));
  return {
    get: sha => tx('readonly', st => st.get(sha)).catch(() => undefined),
    put: (sha, text) => tx('readwrite', st => st.put(text, sha)).catch(() => undefined)
  };
})();

function ghError(status, body) {
  const m = body && body.message ? body.message : '';
  if (status === 401) return 'ключ GitHub не подходит или истёк — введите новый';
  if (status === 403 && /rate limit/i.test(m)) return 'GitHub временно ограничил число запросов, попробуйте через минуту';
  if (status === 403) return 'у ключа нет права записи в репозиторий данных (нужно Contents: Read and write)';
  if (status === 404) return 'репозиторий данных не найден или ключ к нему не допущен';
  return 'GitHub ответил ' + status + (m ? ': ' + m : '');
}

const GitHubBackend = () => {
  const API = 'https://api.github.com/repos/' + ghConf.repo;
  const shas = {};      // путь файла → sha текущей версии
  const texts = {};     // путь файла → текст (чтобы не делать пустых коммитов)
  let branch = 'main';
  let queue = Promise.resolve();
  const serial = fn => (queue = queue.catch(() => {}).then(fn)); // коммиты строго по одному, иначе GitHub отвечает конфликтом

  async function req(path, opt = {}) {
    const r = await fetch(API + path, {
      method: opt.method || 'GET',
      cache: 'no-store',
      headers: Object.assign({Authorization: 'Bearer ' + ghConf.token, Accept: 'application/vnd.github+json'}, opt.body ? {'Content-Type': 'application/json'} : {}),
      body: opt.body ? JSON.stringify(opt.body) : undefined
    });
    if (r.status === 204) return null;
    const j = await r.json().catch(() => null);
    if (!r.ok) { const e = new Error(ghError(r.status, j)); e.status = r.status; e.body = j; throw e; }
    return j;
  }
  const enc = p => p.split('/').map(encodeURIComponent).join('/');

  async function currentSha(path) {
    try { const j = await req('/contents/' + enc(path) + '?ref=' + encodeURIComponent(branch)); return j && j.sha; }
    catch (e) { if (e.status === 404) return undefined; throw e; }
  }

  const putFile = (path, text, message) => serial(async () => {
    if (texts[path] === text && shas[path]) return;
    let sha = shas[path];
    for (let attempt = 0; ; attempt++) {
      try {
        const body = {message, content: b64enc(text), branch};
        if (sha) body.sha = sha;
        const j = await req('/contents/' + enc(path), {method: 'PUT', body});
        shas[path] = j.content.sha; texts[path] = text;
        BlobCache.put(j.content.sha, text);
        return;
      } catch (e) {
        if ((e.status === 409 || e.status === 422) && attempt < 3) { sha = await currentSha(path); continue; }
        throw e;
      }
    }
  });

  const delFile = (path, message) => serial(async () => {
    let sha = shas[path] || await currentSha(path);
    if (!sha) return;
    for (let attempt = 0; ; attempt++) {
      try { await req('/contents/' + enc(path), {method: 'DELETE', body: {message, sha, branch}}); break; }
      catch (e) {
        if (e.status === 404) break;
        if ((e.status === 409 || e.status === 422) && attempt < 3) { sha = await currentSha(path); if (!sha) break; continue; }
        throw e;
      }
    }
    delete shas[path]; delete texts[path];
  });

  const json = doc => JSON.stringify(doc, null, 1) + '\n';
  const monthPath = id => 'months/' + id + '.json';
  const factPath = id => 'facts/' + id + '.json';
  const factLabel = doc => monthLabel(doc.month || '') + (doc.period ? ', ' + doc.period : '');

  return {
    kind: 'github',
    repo: ghConf.repo,
    ping: async () => { const j = await req(''); branch = j.default_branch || 'main'; return 'ok'; },
    load: async (onProgress) => {
      const out = {months: {}, facts: {}, catalog: null};
      let tree;
      try { tree = await req('/git/trees/' + encodeURIComponent(branch) + '?recursive=1'); }
      catch (e) { if (e.status === 409 || e.status === 404) return out; throw e; } // пустой репозиторий — данных ещё нет
      const files = (tree.tree || []).filter(x => x.type === 'blob' && /^(months|facts)\/[^/]+\.json$|^history\.csv$|^settings\/catalog\.json$/.test(x.path));
      let done = 0;
      const one = async f => {
        shas[f.path] = f.sha;
        let text = await BlobCache.get(f.sha);
        if (typeof text !== 'string') {
          const b = await req('/git/blobs/' + f.sha);
          text = b64dec(b.content);
          BlobCache.put(f.sha, text);
        }
        texts[f.path] = text;
        done++; if (onProgress) onProgress(done, files.length);
        if (f.path === 'history.csv') return;
        if (f.path === 'settings/catalog.json') { try { out.catalog = JSON.parse(text); } catch (e) { console.warn('Битые настройки'); } return; }
        try {
          const doc = JSON.parse(text);
          const id = f.path.replace(/^(months|facts)\//, '').replace(/\.json$/, '');
          (f.path.startsWith('months/') ? out.months : out.facts)[id] = doc;
        } catch (e) { console.warn('Битый файл пропущен:', f.path); }
      };
      for (let i = 0; i < files.length; i += 8) await Promise.all(files.slice(i, i + 8).map(one));
      return out;
    },
    saveMonth: (id, doc) => putFile(monthPath(id), json(doc), 'План: ' + monthLabel(id)),
    deleteMonth: id => delFile(monthPath(id), 'Удалён план: ' + monthLabel(id)),
    saveFact: (id, doc) => putFile(factPath(id), json(doc), 'Факт: ' + factLabel(doc)),
    deleteFact: id => delFile(factPath(id), 'Удалён факт: ' + id),
    saveCatalog: doc => putFile('settings/catalog.json', json(doc), 'Настройки: артикулы и категории'),
    importAll: async data => {
      if (data.catalog) await putFile('settings/catalog.json', json(data.catalog), 'Импорт настроек');
      for (const id of Object.keys(data.months || {})) await putFile(monthPath(id), json(data.months[id]), 'Импорт плана: ' + monthLabel(id));
      for (const id of Object.keys(data.facts || {})) await putFile(factPath(id), json(data.facts[id]), 'Импорт факта: ' + factLabel(data.facts[id]));
    },
    saveHistory: rows => {
      const head = ['Месяц', 'Дней с данными', 'Дней в месяце', 'План заказы, руб', 'Факт заказы, руб', '% к плану на дату',
        'Прогноз / итог, руб', '% от плана месяца', 'План ЧП, руб', 'Факт ЧП, руб', '% ЧП к плану на дату', 'Рента факт'];
      const p = v => v === '' || v == null ? '' : Math.round(v * 1000) / 10 + '%';
      const q = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : v;
      const lines = [head].concat(rows.map(r => [monthLabel(r.month), r.loaded, r.days, r.planRub, r.factRub, p(r.pct), r.forecast, p(r.pctMonth),
        r.planChp, r.factChp, p(r.pctChp), p(r.rent)])).map(a => a.map(q).join(','));
      return putFile('history.csv', lines.join('\n') + '\n', 'История план/факт');
    },
    commitsUrl: () => `https://github.com/${ghConf.repo}/commits/${branch}`,
    backup: null
  };
};

const LocalBackend = () => {
  const KEY = 'ozonPlan.data.v1';
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {months: {}, facts: {}}; } catch (e) { return {months: {}, facts: {}}; } };
  const write = d => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) { throw new Error('Браузер не дал сохранить данные (' + e.message + '). Сделайте экспорт в файл.'); } };
  return {
    kind: 'local',
    ping: async () => 'ok',
    load: async () => read(),
    saveMonth: async (id, doc) => { const d = read(); d.months[id] = doc; write(d); },
    deleteMonth: async id => { const d = read(); delete d.months[id]; write(d); },
    saveFact: async (id, doc) => { const d = read(); d.facts[id] = doc; write(d); },
    deleteFact: async id => { const d = read(); delete d.facts[id]; write(d); },
    saveCatalog: async doc => { const d = read(); d.catalog = doc; write(d); },
    importAll: async data => { const d = read(); Object.assign(d.months, data.months || {}); Object.assign(d.facts, data.facts || {}); if (data.catalog) d.catalog = data.catalog; write(d); },
    saveHistory: async () => {},
    backup: null
  };
};

let Backend = null;
const pickBackend = () => (Backend = ghConf.local ? LocalBackend() : ghConf.token ? GitHubBackend() : null);

/* ============ состояние ============ */
const S = {
  months: {}, facts: {}, loaded: false, error: null,
  mid: pref.get('mid', null), tab: pref.get('tab', 'tracker'), mode: pref.get('mode', 'net'),
  scope: 'month', open: new Set(pref.get('open', [])), q: '',
  draft: null, draftOf: null, dirty: false, planMsg: null, pl: null,
  up: {files: [], parsed: {}, msg: null, period: null, confirmDel: null},
  sim: {key: null, sc: null},
  catalog: null,
  cat: {draft: null, dirty: false, msg: null, cab: pref.get('setCab', ''), q: '', sel: new Set(), onlyOn: false, parsed: null}
};

/* ============ периоды месяца: первая неделя до воскресенья, дальше пн–вс ============ */
function periods(mid) {
  const [y, m] = mid.split('-').map(Number);
  const days = new Date(y, m, 0).getDate();
  const list = [];
  let s = 1;
  while (s <= days) {
    let e = s;
    while (e < days && new Date(y, m - 1, e).getDay() !== 0) e++;
    list.push({id: pad(s) + '-' + pad(e), from: s, to: e, days: e - s + 1, label: pad(s) + '.' + pad(m) + '–' + pad(e) + '.' + pad(m)});
    s = e + 1;
  }
  return {list, days};
}

/* ============ настройки: мои артикулы по кабинетам и категориям ============ */
// catalog = {cabinets: ['Взрослый', …], items: [{cab, art, cat, on}]}; on=false — артикул не на моём ведении
function deriveCatalog() {
  const ids = Object.keys(S.months).sort();
  const M = ids.length ? S.months[ids[ids.length - 1]] : null;
  const items = [], seen = new Set();
  ((M && M.plan) || []).forEach(r => {
    const k = r.cab + '|' + r.art;
    if (seen.has(k)) return; seen.add(k);
    items.push({cab: r.cab, art: r.art, cat: r.cat, on: true});
  });
  return {cabinets: M ? (M.cabinets || []).slice() : [], items, derived: true};
}
const catalogDoc = () => (S.catalog && Array.isArray(S.catalog.items) ? S.catalog : deriveCatalog());
function catalogIndex(doc) {
  doc = doc || catalogDoc();
  const byKey = {}, byArt = {}, cabs = (doc.cabinets || []).slice(), catOrder = [];
  doc.items.forEach(it => {
    byKey[it.cab + '|' + it.art] = it;
    (byArt[it.art] = byArt[it.art] || []).push(it);
    if (!cabs.includes(it.cab)) cabs.push(it.cab);
    const k = it.cab + '|' + it.cat;
    if (!catOrder.includes(k)) catOrder.push(k);
  });
  const isOff = (cab, art) => { const it = byKey[cab + '|' + art]; return !!it && it.on === false; };
  return {doc, byKey, byArt, cabs, catOrder, isOff};
}

/* ============ выкуп и доля себестоимости по категории ============ */
// Выкуп = выкуплено / завершено, доля с/с = себестоимость / выручка — по всем артикулам категории за месяц плана.
// Если в этом месяце данных мало — берётся ближайший прошлый месяц с данными.
function factSums(ids, arts) {
  const t = {done: 0, bought: 0, sales: 0, cost: 0};
  ids.forEach(id => {
    const f = S.facts[id];
    arts.forEach(a => {
      const o = (f.o || {})[a], q = (f.p || {})[a];
      if (o) { t.done += o[2] || 0; t.bought += o[3] || 0; }
      if (q) { t.sales += q[0] || 0; t.cost += q[2] || 0; }
    });
  });
  return t;
}
function catAuto(mid, rows) {
  const byCat = {};
  rows.forEach(r => { const k = r.cab + '|' + r.cat; (byCat[k] = byCat[k] || new Set()).add(r.art); });
  const ids = Object.keys(S.facts);
  const months = [...new Set(ids.map(id => id.slice(0, 7)))].sort().reverse();
  const order = [mid].concat(months.filter(m => m < mid), months.filter(m => m > mid).reverse());
  const idsOf = {};
  order.forEach(m => { idsOf[m] = ids.filter(id => id.startsWith(m + '_')); });
  const out = {};
  for (const k in byCat) {
    const res = {buy: null, cshare: null, buyFrom: null, csFrom: null};
    for (const m of order) {
      if (res.buy != null && res.cshare != null) break;
      if (!idsOf[m].length) continue;
      const t = factSums(idsOf[m], byCat[k]);
      if (res.buy == null && t.done >= 10) { res.buy = t.bought / t.done; res.buyFrom = m; }
      if (res.cshare == null && t.sales > 0 && t.cost > 0) { res.cshare = t.cost / t.sales; res.csFrom = m; }
    }
    out[k] = res;
  }
  return out;
}
const DEF_BUY = 0.85;
// выкуп и доля с/с категории: ручное значение категории, иначе из отчётов
const catBuyOf = (c, a) => has(c && c.buy) ? num(c.buy) : (a && a.buy != null ? a.buy : DEF_BUY);
const catCsOf = (c, a) => has(c && c.cshare) ? num(c.cshare) : (a && a.cshare != null ? a.cshare : 0);
const catTarget = c => (c && num(c.target) > 0 ? num(c.target) : 0);

/* ============ расчёт ============ */
const Z = () => ({qty: 0, rub: 0, done: 0, bought: 0, sales: 0, sold: 0, cost: 0, profit: 0});
const addF = (a, b) => { for (const k in a) a[k] += b[k] || 0; return a; };

function model(mid, mode) {
  const M = S.months[mid];
  if (!M) return null;
  const {list: per, days} = periods(mid);
  const F = {};
  per.forEach(p => { const f = S.facts[mid + '_' + p.id]; if (f) F[p.id] = f; });
  const loaded = per.filter(p => F[p.id]).reduce((s, p) => s + p.days, 0);
  const pi = mode === 'margin' ? 4 : 3;
  const scopes = ['month'].concat(per.map(p => p.id));
  const CI = catalogIndex();
  // строки плана: категория из настроек, снятые с ведения не считаются, мои артикулы без плана — с нулевым планом
  const planRows = (M.plan || []).filter(r => !CI.isOff(r.cab, r.art)).map(r => {
    const it = CI.byKey[r.cab + '|' + r.art];
    return it && it.cat && it.cat !== r.cat ? Object.assign({}, r, {cat: it.cat}) : r;
  });
  const inPlan = new Set(planRows.map(r => r.cab + '|' + r.art));
  CI.doc.items.forEach(it => { if (it.on !== false && !inPlan.has(it.cab + '|' + it.art)) planRows.push({cab: it.cab, cat: it.cat, art: it.art, qty: 0, rub: 0}); });
  const catMap = {};
  (M.categories || []).forEach(c => { catMap[c.cab + '|' + c.cat] = c; });
  // план на категорию целиком: у её артикулов своего плана нет
  const isCatPlan = r => catTarget(catMap[r.cab + '|' + r.cat]) > 0;
  const effRub = r => isCatPlan(r) ? 0 : num(r.rub);
  const tot = {}, cnt = {};
  planRows.forEach(r => { tot[r.art] = (tot[r.art] || 0) + effRub(r); cnt[r.art] = (cnt[r.art] || 0) + 1; });
  // себестоимость из отчётов — для артикулов, где в плане она не задана (сначала этот месяц, потом последние отчёты)
  const fu = {cost: {}};
  Object.keys(S.facts).sort((a, b) => (a.startsWith(mid) ? 1 : 0) - (b.startsWith(mid) ? 1 : 0) || a.localeCompare(b)).forEach(id => {
    const f = S.facts[id];
    for (const a in (f.p || {})) { const q = f.p[a]; if (q[1] > 0 && q[2] > 0) fu.cost[a] = q[2] / q[1]; }
  });
  const AU = catAuto(mid, planRows);
  const hasV = v => v != null && v !== '';

  const rows = planRows.map(r => {
    const cc = catMap[r.cab + '|' + r.cat] || {};
    const pick = k => (r[k] != null && r[k] !== '') ? r[k] : cc[k];
    const c = {min: pick('min'), norm: pick('norm'), st: pick('st')};
    const share = tot[r.art] > 0 ? effRub(r) / tot[r.art] : 1 / cnt[r.art];
    const cp = isCatPlan(r);
    const n = {type: 'art', key: r.cab + '|' + r.cat + '|' + r.art, cab: r.cab, cat: r.cat, art: r.art, c, share, catPlan: cp,
      planRub: cp ? 0 : num(r.rub), planQty: cp ? 0 : num(r.qty), planPrice: num(r.price),
      planCost: hasV(r.cost) ? num(r.cost) : (fu.cost[r.art] || 0),
      planBuy: r.buyManual && hasV(r.buy) ? num(r.buy) : catBuyOf(cc, AU[r.cab + '|' + r.cat]), f: {}};
    n.planChp = n.planQty * n.planBuy * n.planCost * num(c.norm);
    scopes.forEach(s => { n.f[s] = Z(); });
    per.forEach(p => {
      const f = F[p.id]; if (!f) return;
      const o = (f.o || {})[r.art], q = (f.p || {})[r.art];
      if (!o && !q) return;
      const x = {qty: (o ? o[0] : 0) * share, rub: (o ? o[1] : 0) * share, done: (o ? o[2] : 0) * share, bought: (o ? o[3] : 0) * share,
        sales: (q ? q[0] : 0) * share, sold: (q ? q[1] : 0) * share, cost: (q ? q[2] : 0) * share, profit: (q ? (q[pi] || 0) : 0) * share};
      addF(n.f[p.id], x); addF(n.f.month, x);
    });
    return n;
  });

  const catList = (M.categories || []).slice();
  rows.forEach(r => { if (!catMap[r.cab + '|' + r.cat]) { const c = {cab: r.cab, cat: r.cat}; catMap[r.cab + '|' + r.cat] = c; catList.push(c); } });
  const firstSeen = k => { const i = rows.findIndex(r => r.cab + '|' + r.cat === k); return i < 0 ? 1e9 : i; };
  const catRank = c => { const k = c.cab + '|' + c.cat, i = CI.catOrder.indexOf(k); return i >= 0 ? i : 1e6 + firstSeen(k); };
  catList.sort((a, b) => catRank(a) - catRank(b));
  const cats = catList.filter(c => num(c.target) > 0 || rows.some(r => r.cab === c.cab && r.cat === c.cat)).map(c => {
    const kids = rows.filter(r => r.cab === c.cab && r.cat === c.cat);
    // пороги категории: средние по артикулам с весом плана в ₽ (если пороги у всех одинаковые — те же самые)
    const th = {};
    ['min', 'norm', 'st'].forEach(k => {
      const ks = kids.filter(x => x.c[k] != null && x.c[k] !== '');
      const w = ks.reduce((a, x) => a + (x.planRub || 0), 0);
      th[k] = ks.length ? (w > 0 ? ks.reduce((a, x) => a + num(x.c[k]) * x.planRub, 0) / w : num(ks[0].c[k])) : (c[k] != null && c[k] !== '' ? num(c[k]) : null);
    });
    const au = AU[c.cab + '|' + c.cat] || {};
    const n = {type: 'cat', key: c.cab + '|' + c.cat, cab: c.cab, cat: c.cat, c: th, cdef: c, kids, f: {},
      buy: catBuyOf(c, au), cshare: catCsOf(c, au), auto: au};
    scopes.forEach(s => { n.f[s] = kids.reduce((a, k) => addF(a, k.f[s]), Z()); });
    const tgt = catTarget(c);
    n.catPlan = tgt > 0;
    if (n.catPlan) {
      // ЧП плана категории = план заказов × выкуп × доля себестоимости в цене × норм ROI
      const norm = has(c.norm) ? num(c.norm) : num(th.norm);
      n.planRub = tgt; n.planChp = tgt * n.buy * n.cshare * norm; n.planQty = 0;
    } else {
      n.planRub = kids.reduce((a, k) => a + k.planRub, 0);
      n.planChp = kids.reduce((a, k) => a + k.planChp, 0);
      n.planQty = kids.reduce((a, k) => a + k.planQty, 0);
    }
    return n;
  });
  const cabOrder = CI.cabs.slice();
  (M.cabinets || []).forEach(c => { if (!cabOrder.includes(c)) cabOrder.push(c); });
  cats.forEach(c => { if (!cabOrder.includes(c.cab)) cabOrder.push(c.cab); });
  const roll = (type, key, kids, extra) => {
    const n = Object.assign({type, key, kids, f: {}}, extra);
    scopes.forEach(s => { n.f[s] = kids.reduce((a, k) => addF(a, k.f[s]), Z()); });
    n.planRub = kids.reduce((a, k) => a + k.planRub, 0);
    n.planChp = kids.reduce((a, k) => a + k.planChp, 0);
    n.planQty = kids.reduce((a, k) => a + k.planQty, 0);
    return n;
  };
  const cabs = cabOrder.filter(cab => cats.some(c => c.cab === cab)).map(cab => roll('cab', cab, cats.filter(c => c.cab === cab), {cab}));
  const total = roll('total', 'total', cabs, {});

  const planArts = new Set(rows.map(r => r.art));
  // артикулы, которые только «не на ведении», в «вне плана» не попадают
  CI.doc.items.forEach(it => { if (it.on === false && !(CI.byArt[it.art] || []).some(x => x.on !== false)) planArts.add(it.art); });
  const out = {type: 'out', key: 'out', f: {}, planRub: 0, planChp: 0};
  scopes.forEach(s => { out.f[s] = Z(); });
  per.forEach(p => {
    const f = F[p.id]; if (!f) return;
    const x = Z();
    for (const a in (f.o || {})) if (!planArts.has(a)) { const o = f.o[a]; x.qty += o[0] || 0; x.rub += o[1] || 0; x.done += o[2] || 0; x.bought += o[3] || 0; }
    for (const a in (f.p || {})) if (!planArts.has(a)) { const q = f.p[a]; x.sales += q[0] || 0; x.sold += q[1] || 0; x.cost += q[2] || 0; x.profit += q[pi] || 0; }
    addF(out.f[p.id], x); addF(out.f.month, x);
  });
  return {mid, M, per, days, loaded, F, rows, cats, cabs, total, out};
}

function met(n, scope, md) {
  const f = n.f[scope] || Z();
  let frac;
  if (scope === 'month') frac = md.loaded / md.days;
  else { const p = md.per.find(x => x.id === scope); frac = p ? p.days / md.days : 0; }
  const plan = (n.planRub || 0) * frac, planChp = (n.planChp || 0) * frac;
  return {
    planMonth: n.planRub || 0, plan, planChp, fact: f.rub, qty: f.qty, chp: f.profit, cost: f.cost,
    pct: plan > 0 ? f.rub / plan : null, pctChp: planChp > 0 ? f.profit / planChp : null,
    rent: f.cost > 0 ? f.profit / f.cost : null, delta: f.rub - plan,
    forecast: scope === 'month' && md.loaded ? f.rub / md.loaded * md.days : null
  };
}

/* ============ ЧТО ВЫГОДНЕЕ (симулятор) ============ */
function simOptions(md) {
  const opts = [];
  md.cats.forEach(c => { if (c.kids.length) opts.push({key: 'cat:' + c.key, label: c.cat + ' — ' + c.cab, grp: 'Категории'}); });
  const arts = [...new Set(md.rows.map(r => r.art))].sort((a, b) => a.localeCompare(b, 'ru'));
  arts.forEach(a => opts.push({key: 'art:' + a, label: a, grp: 'Артикулы'}));
  return opts;
}

function simBase(md, key) {
  let rows, planChp, name;
  if (key.startsWith('cat:')) {
    const k = key.slice(4); const cat = md.cats.find(c => c.key === k);
    rows = cat ? cat.kids : []; planChp = cat ? cat.planChp : 0; name = cat ? cat.cat : k;
  } else {
    const a = key.slice(4); rows = md.rows.filter(r => r.art === a);
    planChp = rows.reduce((s, r) => s + r.planChp, 0); name = a;
  }
  const f = rows.reduce((acc, r) => addF(acc, r.f.month), Z());
  const T = md.total.f.month;
  const catN = key.startsWith('cat:') ? md.cats.find(c => c.key === key.slice(4)) : null;
  const planRub = catN && catN.catPlan ? catN.planRub : rows.reduce((s, r) => s + r.planRub, 0);
  let planQty = rows.reduce((s, r) => s + r.planQty, 0);
  const wq = rows.reduce((s, r) => s + (r.planQty || 1), 0);
  const planCost = rows.reduce((s, r) => s + r.planCost * (r.planQty || 1), 0) / (wq || 1);
  const planBuy = rows.reduce((s, r) => s + r.planBuy * (r.planQty || 1), 0) / (wq || 1);
  const normW = rows.reduce((s, r) => s + num(r.c.norm) * (r.planQty || 1), 0) / (wq || 1);
  const price = f.sold > 0 ? f.sales / f.sold : f.qty > 0 ? f.rub / f.qty : planQty > 0 ? planRub / planQty : 0;
  const cost = f.sold > 0 && f.cost > 0 ? f.cost / f.sold : planCost;
  const buy = f.done > 0 ? f.bought / f.done : planBuy || 0.85;
  let v = f.sales > 0 ? (f.sales - f.cost - f.profit) / f.sales : T.sales > 0 ? (T.sales - T.cost - T.profit) / T.sales : 0.6;
  v = Math.min(Math.max(v, 0), 0.95);
  const r0 = f.cost > 0 ? f.profit / f.cost : cost > 0 && price > 0 ? (price * (1 - v) - cost) / cost : normW;
  if (!planQty && planRub > 0 && price > 0) planQty = Math.round(planRub / price);
  const qtyMonth = md.loaded && f.qty > 0 ? f.qty / md.loaded * md.days : planQty;
  const planPrice = planQty > 0 ? planRub / planQty : (rows.length === 1 ? rows[0].planPrice : 0);
  return {name, price, cost, buy, v, r0, qtyMonth, planQty, planRub, planChp, planPrice, norm: normW, hasFact: f.sold > 0, factQty: f.qty};
}

function simCalc(b, s) {
  const r = s.roi;
  const price = b.cost * (1 + r) / (1 - b.v);
  const sold = s.qty * b.buy;
  const chp = sold * b.cost * r;
  return {price, rub: s.qty * price, sold, chp, perUnit: s.qty > 0 ? chp / s.qty : 0, capital: sold * b.cost, dPrice: b.price > 0 ? price / b.price - 1 : null};
}

function defaultScenarios(b) {
  const q = Math.max(1, Math.round(b.qtyMonth || b.planQty || 100));
  const r = b.r0 > 0.02 ? b.r0 : (b.norm || 0.3);
  return [
    {name: 'Как сейчас', qty: q, roi: r, c: 'var(--sa)'},
    {name: 'Больше объёма', qty: Math.round(q * 1.4), roi: Math.max(0.05, r * 0.6), c: 'var(--sb)'},
    {name: 'Выше маржа', qty: Math.round(q * 0.7), roi: r * 1.5, c: 'var(--sc)'}
  ];
}

  el.innerHTML = `

        <div><b>${R(b.qtyMonth)} шт</b><span>заказов в месяц по текущему темпу</span></div>
        <div><b>${R(b.planQty)} шт · ${P(b.norm)}</b><span>план: заказы и норма ренты</span></div>
        <div><b>${b.planPrice ? R(b.planPrice) + ' ₽' : '–'}</b><span>плановая цена за шт</span></div>
      </div>
      ${b.hasFact ? '' : '<div class="msg info">Продаж по позиции в загруженных периодах нет, расчёт по плановым себестоимости и выкупу и средним расходам по всему плану.</div>'}
      <p class="hint" style="margin-top:10px">Вы задаёте заказы в месяц и ренту. Цена считается из структуры расходов: при ренте R цена = себестоимость × (1 + R) / (1 − доля расходов). ЧП = заказы × выкуп × себестоимость × R. Как спрос реагирует на цену, сайт не знает, поэтому количество при другой цене вы ставите сами.</p>
    </div>
    <div class="sim-grid" style="margin-top:10px">
      ${S.sim.sc.map((s, i) => `
      <div class="card sc" style="--c:${s.c}">
        <div class="head"><input type="text" id="scn${i}" data-i="${i}" data-f="name" value="${esc(s.name)}" aria-label="Название сценария"></div>
        <div class="fld"><label for="scq${i}">Заказов в месяц, шт</label><input type="number" id="scq${i}" data-i="${i}" data-f="qty" value="${Math.round(s.qty)}" min="0" step="1">
          <input type="range" id="scqr${i}" data-i="${i}" data-f="qty" min="0" max="${qMax}" step="1" value="${Math.round(s.qty)}" aria-label="Заказов в месяц"></div>
        <div class="fld"><label for="scr${i}">Рента (ROI), %</label><input type="number" id="scr${i}" data-i="${i}" data-f="roi" value="${Math.round(s.roi * 100)}" step="1">
          <input type="range" id="scrr${i}" data-i="${i}" data-f="roi" min="0" max="${rMax}" step="1" value="${Math.round(s.roi * 100)}" aria-label="Рента"></div>
      </div>`).join('')}
    </div>
    <div class="card" style="margin-top:10px"><div id="simOut"></div></div>
    <div class="split">
      <div class="card"><h2 style="margin-top:0">Сколько продать для той же прибыли</h2><div class="chartbox" id="simChart"></div>
        <p class="hint">Линия: сколько заказов нужно при каждой ренте, чтобы ЧП была как в сценарии «${esc(S.sim.sc[0].name)}». Точка выше линии зарабатывает больше.</p></div>
      <div class="card"><h2 style="margin-top:0">ЧП при разных объёме и ренте</h2><div class="chartbox" id="simMx"></div>
        <p class="hint">Отклонения от сценария «${esc(S.sim.sc[0].name)}» (обведён). Зелёный — больше прибыли, красный — меньше.</p></div>
    </div>`;
  simUpdate();
}

function simUpdate() {
  const md = MD; if (!md) return;
  const b = simBase(md, S.sim.key);
  const sc = S.sim.sc;
  const res = sc.map(s => simCalc(b, s));
  const planRes = simCalc(b, {qty: b.planQty, roi: b.norm});
  const best = res.reduce((bi, r, i) => r.chp > res[bi].chp ? i : bi, 0);
  const rowsDef = [
    ['Заказов в месяц, шт', (s) => R(s.qty), () => R(b.planQty)],
    ['Рента', (s) => P(s.roi), () => P(b.norm)],
    ['Нужная цена, ₽', (s, r) => R(r.price) + (ok(r.dPrice) ? ` <span class="sm" style="display:inline">${r.dPrice >= 0 ? '+' : ''}${P(r.dPrice)}</span>` : ''), (r) => R(r.price)],
    ['Сумма заказов, ₽', (s, r) => R(r.rub), (r) => R(r.rub)],
    ['Выкуплено, шт', (s, r) => R(r.sold), (r) => R(r.sold)],
    ['Деньги в товаре (с/с выкупленного), ₽', (s, r) => R(r.capital), (r) => R(r.capital)],
    ['ЧП за месяц, ₽', (s, r, i) => R(r.chp), (r) => R(r.chp), true],
    ['ЧП на 1 заказ, ₽', (s, r) => R(r.perUnit), (r) => R(r.perUnit)],
    ['ЧП к плану месяца', (s, r) => b.planChp > 0 ? `<span class="st ${pctCls(r.chp / b.planChp)}">${P(r.chp / b.planChp)}</span>` : '–', (r) => b.planChp > 0 ? P(r.chp / b.planChp) : '–']
  ];
  const table = `<table class="cmp"><thead><tr><th></th>${sc.map(s => `<th style="color:${s.c}">${esc(s.name)}</th>`).join('')}<th>План</th></tr></thead><tbody>
    ${rowsDef.map(([lbl, fn, pf, hl]) => `<tr><td>${lbl}</td>${sc.map((s, i) => `<td class="${hl && i === best ? 'best' : ''}">${fn(s, res[i], i)}</td>`).join('')}<td>${pf(planRes)}</td></tr>`).join('')}
  </tbody></table>`;
  const a = res[0], bs = res[best];
  let verdict;
  if (best === 0) verdict = `Больше всего ЧП даёт «${esc(sc[0].name)}»: ${R(a.chp)} ₽ в месяц.`;
  else verdict = `Больше всего ЧП даёт «${esc(sc[best].name)}»: ${R(bs.chp)} ₽, на ${R(bs.chp - a.chp)} ₽ больше, чем «${esc(sc[0].name)}». Для этого цена ${R(bs.price)} ₽ (${bs.dPrice >= 0 ? '+' : ''}${P(bs.dPrice)} к текущей) и ${R(sc[best].qty)} заказов.`;
  const eq = sc.slice(1).map((s, i) => {
    const need = s.roi > 0 ? a.chp / (b.buy * b.cost * s.roi) : null;
    return ok(need) ? `При ренте ${P(s.roi)} («${esc(s.name)}») для той же ЧП, что в «${esc(sc[0].name)}», нужно ${R(need)} заказов (${sc[0].qty > 0 ? P(need / sc[0].qty) : '–'} от текущего объёма).` : '';
  }).filter(Boolean).join(' ');
  $('#simOut').innerHTML = table + `<p class="verdict">${verdict}</p><p class="hint">${eq} Деньги в товаре показывают, сколько себестоимости заморожено в проданном объёме: при большом объёме и низкой ренте прибыль на вложенный рубль ниже.</p>`;
  $('#simChart').innerHTML = isoChart(b, sc, res);
  $('#simMx').innerHTML = matrix(b, sc[0]);
}

function isoChart(b, sc, res) {
  const W = 560, H = 300, L = 56, Rr = 16, T = 26, B = 40;
  const target = res[0].chp;
  const rMax = Math.max(...sc.map(s => s.roi), b.r0, 0.1) * 1.35;
  const qTop = Math.max(...sc.map(s => s.qty), 1) * 1.8;
  const x = r => L + (r / rMax) * (W - L - Rr), y = q => H - B - (Math.min(q, qTop) / qTop) * (H - T - B);
  const k = b.buy * b.cost;
  let path = '', area = '';
  if (target > 0 && k > 0) {
    const pts = [];
    for (let i = 1; i <= 80; i++) { const r = rMax * i / 80; const q = target / (k * r); if (q <= qTop * 1.05) pts.push([x(r), y(q)]); }
    if (pts.length) {
      path = 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L');
      area = `${path} L${x(rMax).toFixed(1)} ${T} L${pts[0][0].toFixed(1)} ${T} Z`;
    }
  }
  const ticksX = [0, 0.25, 0.5, 0.75, 1].map(f => rMax * f), ticksY = [0, 0.25, 0.5, 0.75, 1].map(f => qTop * f);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="Кривая равной прибыли">
    ${ticksY.map(q => `<line x1="${L}" x2="${W - Rr}" y1="${y(q)}" y2="${y(q)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(q) + 4}" text-anchor="end">${R(q)}</text>`).join('')}
    ${ticksX.map(r => `<text x="${x(r)}" y="${H - B + 16}" text-anchor="middle">${P(r)}</text>`).join('')}
    <text x="${(L + W - Rr) / 2}" y="${H - 6}" text-anchor="middle">рента (ROI)</text>
    <text x="${L - 6}" y="12" text-anchor="end">шт/мес</text>
    ${area ? `<path d="${area}" fill="var(--good-bg)" opacity=".7"/>` : ''}
    ${path ? `<path d="${path}" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-dasharray="4 3"/>` : ''}
    ${sc.map((s, i) => `<circle cx="${x(s.roi)}" cy="${y(s.qty)}" r="6" fill="${s.c}" stroke="var(--surface)" stroke-width="2"/>
      <text class="lbl-strong" x="${x(s.roi) + 9}" y="${y(s.qty) - 8}">${esc(s.name)}</text>`).join('')}
  </svg>`;
}

function matrix(b, s0) {
  const qf = [0.6, 0.8, 1, 1.2, 1.4], rf = [0.6, 0.8, 1, 1.2, 1.4];
  const base = simCalc(b, s0).chp;
  const cell = (q, r) => simCalc(b, {qty: q, roi: r}).chp;
  const color = v => {
    if (!(base > 0)) return '';
    const d = v / base - 1, a = Math.min(Math.abs(d), 0.6) / 0.6;
    return d >= 0 ? `background:color-mix(in srgb, var(--good-bg) ${30 + a * 70}%, transparent)` : `background:color-mix(in srgb, var(--bad-bg) ${30 + a * 70}%, transparent)`;
  };
  return `<table class="mx"><thead><tr><th>шт \\ рента</th>${rf.map(f => `<th>${P(s0.roi * f)}</th>`).join('')}</tr></thead><tbody>
    ${qf.map(fq => `<tr><th>${R(s0.qty * fq)}</th>${rf.map(fr => { const v = cell(s0.qty * fq, s0.roi * fr); return `<td class="${fq === 1 && fr === 1 ? 'me' : ''}" style="${color(v)}">${MN(v)}</td>`; }).join('')}</tr>`).join('')}
  </tbody></table>`;
}

function ensureDraft() {
  if (!S.mid || !S.months[S.mid]) { S.draft = null; return; }
  if (!S.dirty || S.draftOf !== S.mid) { S.draft = syncDraft(clone(S.months[S.mid])); S.draftOf = S.mid; S.dirty = false; }
}

/* План месяца приводится к настройкам: категории артикулов — из настроек, мои артикулы без плана добавляются с нулём,
   ROI артикула, равный ROI категории, считается унаследованным (пустая ячейка), ₽ = цена × шт. Итоговые цифры не меняются. */
function syncDraft(D) {
  const CI = catalogIndex();
  D.plan = D.plan || []; D.categories = D.categories || [];
  D.plan.forEach(r => { const it = CI.byKey[r.cab + '|' + r.art]; if (it && it.cat) r.cat = it.cat; });
  const have = new Set(D.plan.map(r => r.cab + '|' + r.art));
  CI.doc.items.forEach(it => {
    if (it.on !== false && !have.has(it.cab + '|' + it.art)) D.plan.push({cab: it.cab, cat: it.cat, art: it.art, price: null, qty: 0, rub: 0, min: null, norm: null, st: null});
  });
  const ck = new Set(D.categories.map(c => c.cab + '|' + c.cat));
  D.plan.forEach(r => { const k = r.cab + '|' + r.cat; if (!ck.has(k)) { ck.add(k); D.categories.push({cab: r.cab, cat: r.cat, min: null, norm: null, st: null}); } });
  ['min', 'norm', 'st'].forEach(k => D.categories.forEach(c => {
    const kids = D.plan.filter(r => r.cab === c.cab && r.cat === c.cat);
    if (!has(c[k]) && kids.length && kids.every(r => has(r[k]))) {
      const vals = [...new Set(kids.map(r => num(r[k])))];
      if (vals.length === 1) c[k] = vals[0];
    }
    if (has(c[k])) kids.forEach(r => { if (has(r[k]) && Math.abs(num(r[k]) - num(c[k])) < 1e-9) r[k] = null; });
  }));
  D.plan.forEach(r => { if (has(r.price) && num(r.price) > 0) r.rub = Math.round(num(r.price) * num(r.qty)); });
  // выкуп артикула — только если вписан вручную, иначе средний по категории
  D.plan.forEach(r => { if (!r.buyManual || !has(r.buy)) { delete r.buy; delete r.buyManual; } delete r.buyGuess; });
  const first = {};
  D.plan.forEach((r, i) => { const k = r.cab + '|' + r.cat; if (first[k] == null) first[k] = i; });
  const cabRank = c => { const i = CI.cabs.indexOf(c); return i < 0 ? 1e6 : i; };
  const catRank = k => { const i = CI.catOrder.indexOf(k); return i < 0 ? 1e6 + first[k] : i; };
  D.plan = D.plan.map((r, i) => ({r, i})).sort((a, b) => cabRank(a.r.cab) - cabRank(b.r.cab) || catRank(a.r.cab + '|' + a.r.cat) - catRank(b.r.cab + '|' + b.r.cat) || a.i - b.i).map(x => x.r);
  const used = new Set(D.plan.map(r => r.cab + '|' + r.cat));
  D.categories = D.categories.filter(c => used.has(c.cab + '|' + c.cat) || num(c.target) > 0);
  D.cabinets = CI.cabs.filter(c => D.plan.some(r => r.cab === c)).concat([...new Set(D.plan.map(r => r.cab))].filter(c => !CI.cabs.includes(c)));
  return D;
}

/* --- чтение Excel с планом --- */
function parsePlan(rows) {
  let hi = -1;
  for (let i = 0; i < Math.min(rows.length, 15); i++) {
    if ((rows[i] || []).some(h => /артикул/i.test(String(h ?? '')))) { hi = i; break; }
  }
  if (hi < 0) throw new Error('Не нашёл строку заголовков: нужна колонка «Артикул».');
  const head = (rows[hi] || []).map(h => String(h ?? '').trim().toLowerCase());
  const col = {};
  head.forEach((h, i) => {
    if (!h) return;
    if (/^чп|чистая прибыль/.test(h)) return; // считается сама
    if (col.art == null && /артикул/.test(h)) col.art = i;
    else if (col.cab == null && /кабинет/.test(h)) col.cab = i;
    else if (col.cat == null && /категор/.test(h)) col.cat = i;
    else if (col.cost == null && /с\/с|себест/.test(h)) col.cost = i;
    else if (col.buy == null && /выкуп/.test(h)) col.buy = i;
    else if (col.price == null && /цен/.test(h)) col.price = i;
    else if (col.min == null && /порог|мин/.test(h)) col.min = i;
    else if (col.st == null && /сверх|макс/.test(h)) col.st = i;
    else if (col.norm == null && /норм/.test(h)) col.norm = i;
    else if (col.qty == null && /шт|кол-?во|количеств/.test(h)) col.qty = i;
    else if (col.rub == null && /₽|руб|деньг|сумм/.test(h)) col.rub = i;
  });
  const CI = catalogIndex();
  if (col.qty == null && col.rub == null) throw new Error('Нужна хотя бы одна из колонок «План, шт» или «План, ₽».');
  const isF = (ri, c) => !!(rows.formula && c != null && rows.formula.has(ri + ':' + c));
  const out = [], cats = [], warn = [], catDiff = [], fresh = [];
  let cab0 = '', cat0 = '';
  rows.slice(hi + 1).forEach((r, k) => {
    r = r || [];
    const ri = hi + 1 + k;
    const art = String(r[col.art] ?? '').trim();
    const cell = c => col[c] != null && has(r[col[c]]) ? String(r[col[c]]).trim() : '';
    const g = c => col[c] == null || !has(r[col[c]]) || isF(ri, col[c]) ? null : num(r[col[c]]);
    if (cell('cab')) cab0 = cell('cab');
    if (cell('cat')) cat0 = cell('cat');
    if (!art) {
      // строка категории (шаблон с сайта): ROI, выкуп, доля с/с и план на всю категорию; суммы-формулы пропускаются
      if (cell('cat') && cab0) {
        const tgt = g('rub');
        cats.push({cab: cab0, cat: cell('cat'), min: g('min'), norm: g('norm'), st: g('st'), buy: g('buy'), cshare: g('cost'), target: tgt > 0 ? tgt : null});
      }
      return;
    }
    if (/^итог/i.test(art)) return;
    // кабинет: из файла, иначе из настроек (если артикул там в одном кабинете)
    let cab = col.cab != null ? cab0 : '';
    const known = CI.byArt[art] || [];
    if (!cab && known.length === 1) cab = known[0].cab;
    if (!cab) { warn.push(`строка ${ri + 1}: у «${art}» не указан кабинет` + (known.length > 1 ? ' (артикул есть в нескольких кабинетах)' : '')); return; }
    // категория: из настроек, иначе из файла
    const it = CI.byKey[cab + '|' + art];
    const fileCat = col.cat != null ? cat0 : '';
    const cat = it && it.cat ? it.cat : fileCat || 'Без категории';
    if (it && fileCat && fileCat !== it.cat) catDiff.push(`${art}: в файле «${fileCat}», в настройках «${it.cat}»`);
    if (!it) fresh.push({cab, art, cat});
    out.push({cab, cat, art, price: g('price'), qty: g('qty'), rub: g('rub'), min: g('min'), norm: g('norm'), st: g('st'), cost: g('cost'), buy: g('buy')});
  });
  // ROI: в процентах (120) или долях (1,2); выкуп и доля с/с: 85 или 0,85 — решаем по колонке целиком
  const all = out.concat(cats);
  ['min', 'norm', 'st'].forEach(k => {
    if (all.some(x => x[k] != null && x[k] > 10)) all.forEach(x => { if (x[k] != null) x[k] = x[k] / 100; });
  });
  if (all.some(x => x.buy != null && x.buy > 1.5)) all.forEach(x => { if (x.buy != null) x.buy = x.buy / 100; });
  if (cats.some(x => x.cshare != null && x.cshare > 1.5)) cats.forEach(x => { if (x.cshare != null) x.cshare = x.cshare / 100; });
  out.forEach(x => {
    if (x.rub == null && x.qty != null && x.price) x.rub = Math.round(x.qty * x.price);
    if (x.qty == null && x.rub != null && x.price) x.qty = Math.round(x.rub / x.price);
    if (x.price == null && x.qty && x.rub) x.price = Math.round(x.rub / x.qty);
    x.qty = x.qty || 0; x.rub = x.rub || 0;
  });
  const seen = new Set(), dup = [];
  out.forEach(x => { const key = x.cab + '|' + x.art; if (seen.has(key)) dup.push(x.art + ' (' + x.cab + ')'); seen.add(key); });
  if (dup.length) warn.push('артикул повторяется в одном кабинете: ' + dup.slice(0, 6).join(', ') + (dup.length > 6 ? '…' : '') + ' — строки сложатся как разные позиции');
  if (!out.length) throw new Error('В файле нет строк с артикулами.');
  if (catDiff.length) warn.push('категория взята из настроек: ' + catDiff.slice(0, 5).join('; ') + (catDiff.length > 5 ? ` и ещё ${catDiff.length - 5}` : ''));
  return {rows: out, cats, warn, fresh};
}

/* себестоимость и выкуп: из этого месяца, из других месяцев, из последних отчётов */
function costBuyLookup(targetMid) {
  const byCabArt = {}, byArt = {};
  const mids = Object.keys(S.months).sort().reverse();
  if (targetMid && S.months[targetMid]) mids.unshift(targetMid);
  mids.forEach(mid => (S.months[mid].plan || []).forEach(r => {
    const v = {cost: has(r.cost) ? num(r.cost) : null, buy: has(r.buy) ? num(r.buy) : null};
    const k = r.cab + '|' + r.art;
    if (!byCabArt[k] && (v.cost != null || v.buy != null)) byCabArt[k] = v;
    if (!byArt[r.art] && (v.cost != null || v.buy != null)) byArt[r.art] = v;
  }));
  const fact = {};
  Object.keys(S.facts).sort().reverse().forEach(id => {
    const f = S.facts[id];
    for (const a in (f.p || {})) { const p = f.p[a]; if (p[1] > 0 && p[2] > 0) { fact[a] = fact[a] || {}; if (fact[a].cost == null) fact[a].cost = p[2] / p[1]; } }
    for (const a in (f.o || {})) { const o = f.o[a]; if (o[2] >= 10) { fact[a] = fact[a] || {}; if (fact[a].buy == null) fact[a].buy = o[3] / o[2]; } }
  });
  return (cab, art) => {
    const a = byCabArt[cab + '|' + art] || {}, b = byArt[art] || {}, c = fact[art] || {};
    const cost = a.cost != null ? a.cost : b.cost != null ? b.cost : c.cost != null ? Math.round(c.cost * 100) / 100 : null;
    const buy = a.buy != null ? a.buy : b.buy != null ? b.buy : c.buy != null ? Math.round(c.buy * 10000) / 10000 : null;
    return {cost, buy};
  };
}

function buildPlanDoc(parsed, mid) {
  const base = S.months[mid] ? clone(S.months[mid]) : {};
  const look = costBuyLookup(mid);
  const plan = parsed.rows.map(x => {
    const r = {cab: x.cab, cat: x.cat, art: x.art, price: x.price, qty: x.qty, rub: x.rub, min: x.min, norm: x.norm, st: x.st,
      cost: x.cost != null ? x.cost : look(x.cab, x.art).cost};
    if (x.buy != null) { r.buy = x.buy; r.buyManual = true; }
    return r;
  });
  const oldCats = {}, fileCats = {};
  (base.categories || []).forEach(c => { oldCats[c.cab + '|' + c.cat] = c; });
  (parsed.cats || []).forEach(c => { fileCats[c.cab + '|' + c.cat] = c; });
  const fromTemplate = (parsed.cats || []).length > 0;
  const AU = catAuto(mid, plan);
  const near = (a, b) => a != null && b != null && Math.abs(a - b) < 0.0006;
  const categories = [], cabinets = [];
  plan.forEach(r => {
    if (!cabinets.includes(r.cab)) cabinets.push(r.cab);
    const k = r.cab + '|' + r.cat;
    if (categories.some(c => c.cab + '|' + c.cat === k)) return;
    const old = oldCats[k] || {}, fc = fileCats[k], au = AU[k] || {};
    if (fc) {
      // выкуп и доля с/с, совпадающие с посчитанными по отчётам, — не ручные
      categories.push({cab: r.cab, cat: r.cat, min: fc.min, norm: fc.norm, st: fc.st, target: fc.target,
        buy: fc.buy != null && !near(fc.buy, au.buy != null ? au.buy : DEF_BUY) ? fc.buy : null, cshare: fc.cshare != null && !near(fc.cshare, au.cshare) ? fc.cshare : null, note: old.note || ''});
      return;
    }
    const first = plan.find(x => x.cab === r.cab && x.cat === r.cat && x.norm != null) || {};
    const artPlan = plan.some(x => x.cab === r.cab && x.cat === r.cat && num(x.rub) > 0);
    categories.push({cab: r.cab, cat: r.cat, min: has(first.min) ? first.min : old.min ?? null, norm: has(first.norm) ? first.norm : old.norm ?? null, st: has(first.st) ? first.st : old.st ?? null,
      target: fromTemplate || artPlan ? null : old.target ?? null, buy: old.buy ?? null, cshare: old.cshare ?? null, note: old.note || ''});
  });
  return syncDraft({cabinets, categories, plan, copiedFrom: base.copiedFrom || null, source: 'Excel: ' + (S.pl && S.pl.name || '')});
}

/* новые артикулы из плана — в настройки (настройки при этом создаются, если их ещё не было) */
async function addToCatalog(items) {
  const doc = clone(catalogDoc()); delete doc.derived;
  const have = new Set(doc.items.map(it => it.cab + '|' + it.art));
  const add = items.filter(it => !have.has(it.cab + '|' + it.art));
  if (!add.length && S.catalog) return 0;
  add.forEach(it => { doc.items.push({cab: it.cab, art: it.art, cat: it.cat, on: true}); if (!doc.cabinets.includes(it.cab)) doc.cabinets.push(it.cab); });
  await Backend.saveCatalog(doc);
  S.catalog = doc; S.cat.draft = null; S.cat.dirty = false;
  return add.length;
}

/* --- выгрузка плана в Excel (xlsx собирается в браузере) --- */
const NS_MAIN = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
const XMLH = '<' + '?xml version="1.0" encoding="UTF-8" standalone="yes"?' + '>';
/* --- таблица плана в Excel: как на сайте, с формулами; её же можно загрузить обратно --- */
const TPL_COLS = ['Кабинет', 'Категория', 'Артикул', 'Цена, ₽', 'План, шт', 'План, ₽', 'Порог ROI', 'Норм ROI', 'Сверх ROI', 'С/с, ₽/шт (в строке категории — % от цены)', 'Выкуп', 'ЧП план, ₽', 'ЧП при сверх ROI, ₽'];
async function exportPlanXlsx(mid) {
  const src = S.draftOf === mid && S.draft ? S.draft : S.months[mid];
  if (!src) return;
  const D = syncDraft(clone(src));
  const CIx = catalogIndex();
  D.plan = D.plan.filter(r => !CIx.isOff(r.cab, r.art));
  const AU = catAuto(mid, D.plan);
  const md = model(mid, S.mode), fb = {};
  if (md) md.rows.forEach(n => { fb[n.cab + '|' + n.art] = n; });
  const cm = {};
  D.categories.forEach(c => { cm[c.cab + '|' + c.cat] = c; });
  const groups = [];
  D.plan.forEach(r => { const k = r.cab + '|' + r.cat; let g = groups[groups.length - 1]; if (!g || g.k !== k) groups.push(g = {k, cab: r.cab, cat: r.cat, rows: []}); g.rows.push(r); });
  const E = v => (v == null || v === '' || !isFinite(v) ? '' : v);
  const rows = [
    [{v: 'План продаж Ozon — ' + monthLabel(mid), s: 7}],
    [{v: 'Строка категории: ROI, выкуп и доля себестоимости действуют на всю категорию; пустая ячейка ниже = значение категории. План на всю категорию — впишите сумму в «План, ₽» строки категории вместо формулы.', s: 10}],
    TPL_COLS.map(h => ({v: h, s: 1}))
  ];
  groups.forEach(g => {
    const c = cm[g.k] || {}, au = AU[g.k] || {}, r0 = rows.length + 1, a = r0 + 1, b = r0 + g.rows.length;
    const cp = catTarget(c) > 0, buy = catBuyOf(c, au), cs = catCsOf(c, au), norm = num(c.norm);
    const arts = g.rows.map((r, j) => {
      const n = a + j, f = fb[r.cab + '|' + r.art] || {};
      const cost = has(r.cost) ? num(r.cost) : Math.round(f.planCost || 0) || '';
      const rn = has(r.norm) ? num(r.norm) : norm, rb = r.buyManual && has(r.buy) ? num(r.buy) : buy;
      const rub = has(r.price) && num(r.price) > 0 ? Math.round(num(r.price) * num(r.qty)) : num(r.rub);
      const chp = num(r.qty) * rb * num(cost) * rn;
      const rs = has(r.st) ? num(r.st) : has(c.st) ? num(c.st) : rn, chpSt = num(r.qty) * rb * num(cost) * rs;
      return [r.cab, r.cat, r.art, {v: E(has(r.price) ? num(r.price) : ''), s: 2},
        {v: cp ? '' : E(num(r.qty) || ''), s: 2},
        cp ? '' : has(r.price) && num(r.price) > 0 ? {f: `D${n}*E${n}`, v: rub, s: 2} : {v: E(rub || ''), s: 2},
        {v: E(has(r.min) ? num(r.min) : ''), s: 3}, {v: E(has(r.norm) ? num(r.norm) : ''), s: 3}, {v: E(has(r.st) ? num(r.st) : ''), s: 3},
        {v: E(cost), s: 2}, {v: E(r.buyManual && has(r.buy) ? num(r.buy) : ''), s: 8},
        cp ? '' : {f: `E${n}*IF(K${n}="",K$${r0},K${n})*J${n}*IF(H${n}="",H$${r0},H${n})`, v: Math.round(chp), s: 2},
        cp ? '' : {f: `E${n}*IF(K${n}="",K$${r0},K${n})*J${n}*IF(I${n}<>"",I${n},IF(I$${r0}<>"",I$${r0},IF(H${n}<>"",H${n},H$${r0})))`, v: Math.round(chpSt), s: 2}];
    });
    const sum = col => arts.reduce((t, x) => t + (typeof x[col] === 'object' && x[col] ? num(x[col].v) : num(x[col])), 0);
    rows.push([{v: g.cab, s: 4}, {v: g.cat, s: 4}, {v: '', s: 4}, {v: '', s: 4},
      cp ? {v: '', s: 5} : {f: `SUM(E${a}:E${b})`, v: sum(4), s: 5},
      cp ? {v: catTarget(c), s: 5} : {f: `SUM(F${a}:F${b})`, v: sum(5), s: 5},
      {v: E(has(c.min) ? num(c.min) : ''), s: 6}, {v: E(has(c.norm) ? num(c.norm) : ''), s: 6}, {v: E(has(c.st) ? num(c.st) : ''), s: 6},
      {v: E(cs || ''), s: 9}, {v: E(buy), s: 9},
      cp ? {f: `F${r0}*K${r0}*J${r0}*H${r0}`, v: Math.round(catTarget(c) * buy * cs * norm), s: 5} : {f: `SUM(L${a}:L${b})`, v: sum(11), s: 5},
      cp ? {f: `F${r0}*K${r0}*J${r0}*IF(I${r0}<>"",I${r0},H${r0})`, v: Math.round(catTarget(c) * buy * cs * (has(c.st) ? num(c.st) : norm)), s: 5} : {f: `SUM(M${a}:M${b})`, v: sum(12), s: 5}]);
    arts.forEach(x => rows.push(x));
  });
  await saveWorkbook('plan-' + mid + '.xlsx', [{name: 'План месяца', widths: [12, 24, 30, 11, 11, 14, 10, 10, 10, 14, 10, 14, 14], rows, freeze: 3}]);
}

/* xlsx собирается в браузере. Стили: 0 текст, 1 заголовок, 2 число, 3 %, 4–6 строка категории (текст/число/%), 7 титул, 8 0,0%, 9 категория 0,0%, 10 примечание */
async function saveWorkbook(fileName, sheets) {
  const x = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const colL = c => c < 26 ? String.fromCharCode(65 + c) : String.fromCharCode(64 + Math.floor(c / 26)) + String.fromCharCode(65 + c % 26);
  const cellXml = (ref, cell) => {
    const o = cell && typeof cell === 'object' ? cell : {v: cell};
    const st = o.s || 0;
    if (o.f) return `<c r="${ref}" s="${st}"><f>${x(o.f)}</f>${o.v != null && o.v !== '' && isFinite(o.v) ? `<v>${o.v}</v>` : ''}</c>`;
    if (o.v == null || o.v === '') return st ? `<c r="${ref}" s="${st}"/>` : '';
    if (typeof o.v === 'number' && isFinite(o.v)) return `<c r="${ref}" s="${st}"><v>${o.v}</v></c>`;
    return `<c r="${ref}" t="inlineStr" s="${st}"><is><t>${x(o.v)}</t></is></c>`;
  };
  const sheetXml = sh => {
    const rowsXml = sh.rows.map((r, k) => `<row r="${k + 1}">${r.map((cell, i) => cellXml(colL(i) + (k + 1), cell)).join('')}</row>`).join('');
    const pane = sh.freeze ? `<pane ySplit="${sh.freeze}" topLeftCell="A${sh.freeze + 1}" activePane="bottomLeft" state="frozen"/>` : '';
    return `${XMLH}<worksheet xmlns="${NS_MAIN}"><sheetViews><sheetView workbookViewId="0">${pane}</sheetView></sheetViews><cols>${sh.widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${rowsXml}</sheetData></worksheet>`;
  };
  const xf = (num, font, fill, extra) => `<xf numFmtId="${num}" fontId="${font}" fillId="${fill}" borderId="${extra && extra.border ? 1 : 0}" xfId="0"${num ? ' applyNumberFormat="1"' : ''}${font ? ' applyFont="1"' : ''}${fill ? ' applyFill="1"' : ''}${extra && extra.wrap ? ' applyAlignment="1"><alignment wrapText="1" vertical="center"/></xf>' : '/>'}`;
  const stylesXml = `${XMLH}<styleSheet xmlns="${NS_MAIN}"><numFmts count="1"><numFmt numFmtId="164" formatCode="0.0%"/></numFmts>` +
    `<fonts count="4"><font><sz val="10"/><name val="Arial"/></font><font><b/><sz val="10"/><name val="Arial"/></font><font><b/><sz val="13"/><name val="Arial"/></font><font><i/><sz val="9"/><color rgb="FF5D6676"/><name val="Arial"/></font></fonts>` +
    `<fills count="4"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE6EAFC"/><bgColor indexed="64"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFF3F4F7"/><bgColor indexed="64"/></patternFill></fill></fills>` +
    `<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left/><right/><top/><bottom style="thin"><color rgb="FFC9CED8"/></bottom><diagonal/></border></borders>` +
    `<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="11">` +
    xf(0, 0, 0) + xf(0, 1, 3, {border: 1, wrap: 1}) + xf(3, 0, 0) + xf(9, 0, 0) + xf(0, 1, 2) + xf(3, 1, 2) + xf(9, 1, 2) + xf(0, 2, 0) + xf(164, 0, 0) + xf(164, 1, 2) + xf(0, 3, 0) +
    `</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  await ensureJSZip();
  const zip = new JSZip();
  zip.file('[Content_Types].xml', XMLH + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
    sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('') +
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>');
  zip.file('_rels/.rels', XMLH + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
  zip.file('xl/workbook.xml', XMLH + `<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((sh, i) => `<sheet name="${x(sh.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets><calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>`);
  zip.file('xl/_rels/workbook.xml.rels', XMLH + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('') +
    `<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`);
  sheets.forEach((sh, i) => zip.file(`xl/worksheets/sheet${i + 1}.xml`, sheetXml(sh)));
  zip.file('xl/styles.xml', stylesXml);
  const blob = await zip.generateAsync({type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const el = document.createElement('a');
  el.href = URL.createObjectURL(blob);
  el.download = fileName;
  document.body.appendChild(el); el.click(); el.remove();
  setTimeout(() => URL.revokeObjectURL(el.href), 4000);
}

/* живой пересчёт: ₽ = цена × шт, ЧП = шт × выкуп × себестоимость × норм ROI; план на категорию: ЧП = ₽ × выкуп × доля с/с × норм ROI */
function planCalc() {
  const D = S.draft; if (!D) return;
  const CI = catalogIndex(), AU = S.planAuto || {};
  const cm = {};
  D.categories.forEach(c => { cm[c.cab + '|' + c.cat] = c; });
  const fb = {};
  if (MD && MD.mid === S.mid) MD.rows.forEach(n => { fb[n.cab + '|' + n.art] = n; });
  const G = {}, T = {qty: 0, rub: 0, chp: 0, base: 0, chs: 0};
  D.plan.forEach((r, i) => {
    if (CI.isOff(r.cab, r.art)) return;
    const k = r.cab + '|' + r.cat, c = cm[k] || {}, f = fb[r.cab + '|' + r.art] || {};
    const cp = catTarget(c) > 0, cbuy = catBuyOf(c, AU[k]);
    if (has(r.price) && num(r.price) > 0) r.rub = Math.round(num(r.price) * num(r.qty));
    const norm = has(r.norm) ? num(r.norm) : num(c.norm);
    const cost = has(r.cost) ? num(r.cost) : (f.planCost || 0);
    const buy = r.buyManual && has(r.buy) ? num(r.buy) : cbuy;
    const base = cp ? 0 : num(r.qty) * buy * cost, chp = base * norm;
    const chs = base * (has(r.st) ? num(r.st) : has(c.st) ? num(c.st) : norm); // нет сверх — как по норме
    const tr = document.querySelector(`tr[data-i="${i}"]`);
    const gi = tr ? tr.dataset.gi : null;
    if (tr) {
      tr.classList.toggle('cpart', cp);
      tr.querySelectorAll(`input[data-k="p.${i}.price"], input[data-k="p.${i}.qty"]`).forEach(x => { x.disabled = cp; });
      const bi = tr.querySelector(`input[data-k="p.${i}.buy"]`); if (bi) bi.placeholder = pctIn(cbuy);
    }
    const rb = document.getElementById('rb' + i), ch = document.getElementById('chp' + i);
    if (rb) {
      rb.textContent = cp ? 'общий план' : num(r.rub) ? R(r.rub) : (num(r.qty) && !has(r.price) ? 'нет цены' : '–');
      rb.classList.toggle('warn-t', !cp && !!num(r.qty) && !has(r.price) && !num(r.rub));
    }
    if (ch) ch.textContent = chp ? R(chp) : '–';
    const cs = document.getElementById('chs' + i); if (cs) cs.textContent = chs ? R(chs) : '–';
    if (gi != null) { const g = G[gi] = G[gi] || {qty: 0, rub: 0, chp: 0, base: 0, chs: 0, k}; g.qty += cp ? 0 : num(r.qty); g.rub += cp ? 0 : num(r.rub); g.chp += chp; g.base += base; g.chs += chs; }
  });
  Object.keys(G).forEach(gi => {
    const g = G[gi], c = cm[g.k] || {}, tgt = catTarget(c);
    if (tgt > 0) { g.rub = tgt; g.base = tgt * catBuyOf(c, AU[g.k]) * catCsOf(c, AU[g.k]); g.chp = g.base * num(c.norm); g.chs = g.base * (has(c.st) ? num(c.st) : num(c.norm)); }
    const gs = document.getElementById('gs' + gi); if (gs) gs.textContent = g.chs ? R(g.chs) + ' ₽' : '–';
    const q = document.getElementById('gq' + gi); if (q) q.textContent = tgt > 0 ? '–' : g.qty ? R(g.qty) + ' шт' : '–';
    const r = document.getElementById('gr' + gi); if (r) r.placeholder = g.rub && !tgt ? R(g.rub) + ' ₽' : 'сумма';
    const ch = document.getElementById('gc' + gi);
    if (ch) { ch.textContent = g.chp ? R(g.chp) + ' ₽' : '–'; ch.title = tgt > 0 && !catCsOf(c, AU[g.k]) ? 'Нет доли себестоимости — впишите её в строке категории' : ''; }
    T.qty += g.qty; T.rub += g.rub; T.chp += g.chp; T.base += g.base; T.chs += g.chs;
  });
  const tot = document.getElementById('planTot');
  if (tot) tot.innerHTML = `<div><b>${R(T.qty)} шт</b><span>план заказов по артикулам</span></div>
    <div><b>${MN(T.rub)} ₽</b><span>план заказов</span></div>
    <div><b>${MN(T.chp)} ₽</b><span>план ЧП (по норм ROI)</span></div>
    <div><b>${MN(T.chs)} ₽</b><span>ЧП при сверх ROI</span></div>
    <div><b>${T.base ? P(T.chp / T.base) : '–'}</b><span>ROI плана (средний)</span></div>`;
}
