name: Деплой в Google Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.clasp.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_ID: ${{ vars.DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Установить clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Доступ к Google
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "Нет секрета CLASPRC_JSON"; exit 1; fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Залить код в проект
        run: clasp push --force

      - name: Обновить веб-приложение (ссылка не меняется)
        run: |
          if [ -z "$DEPLOYMENT_ID" ]; then echo "Нет переменной DEPLOYMENT_ID"; exit 1; fi
          MSG="$(git log -1 --pretty=%s | cut -c1-90)"
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "${GITHUB_SHA::7} ${MSG}"
