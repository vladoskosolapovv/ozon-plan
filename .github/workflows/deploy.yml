name: Деплой в Google Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.clasp.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_ID: AKfycbxe9JT1edW3Lj3BR2Q8YMGTw0MKBDmkRyKSr26QPWnMXpa1qtQ2Gq6VwDFjA-aXfjzCVQ
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установить clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Доступ к Google
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "::error::Нет секрета CLASPRC_JSON"; exit 1; fi
          # ключ от clasp 2.x кладём как есть, от clasp 3.x переводим в формат 2.x; значения не печатаем
          node -e '
            const fs = require("fs"), os = require("os");
            let raw = process.env.CLASPRC_JSON.replace(/^\uFEFF/, "").trim(), j;
            try { j = JSON.parse(raw); } catch (e) { console.log("::error::CLASPRC_JSON не JSON: " + e.message); process.exit(1); }
            let out = j, fmt = "clasp 2.x";
            if (j.tokens) {
              const t = j.tokens.default || Object.values(j.tokens)[0] || {};
              fmt = "clasp 3.x";
              out = {
                token: {access_token: t.access_token || "", refresh_token: t.refresh_token, scope: t.scope || "", token_type: t.token_type || "Bearer", expiry_date: t.expiry_date || 0},
                oauth2ClientSettings: {clientId: t.client_id, clientSecret: t.client_secret, redirectUri: "http://localhost"},
                isLocalCreds: false
              };
            }
            const ok = out.token && out.token.refresh_token && out.oauth2ClientSettings && out.oauth2ClientSettings.clientId;
            console.log("::notice title=Ключ::формат " + fmt + ", поля: " + Object.keys(j).join(", ") + (ok ? ", refresh_token есть" : ", НЕТ refresh_token/clientId"));
            if (!ok) process.exit(1);
            fs.writeFileSync(os.homedir() + "/.clasprc.json", JSON.stringify(out));
          '

      - name: Залить код в проект
        run: |
          set -o pipefail
          if ! clasp push --force 2>&1 | tee push.log; then
            echo "::error title=clasp push::$(tr '\n' ' ' < push.log | cut -c1-900)"
            exit 1
          fi

      - name: Обновить веб-приложение (ссылка не меняется)
        run: |
          MSG="$(git log -1 --pretty=%s | cut -c1-90)"
          set -o pipefail
          if ! clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "${GITHUB_SHA::7} ${MSG}" 2>&1 | tee deploy.log; then
            echo "::error title=clasp deploy::$(tr '\n' ' ' < deploy.log | cut -c1-900)"
            exit 1
          fi
          echo "::notice title=Готово::$(tr '\n' ' ' < deploy.log | cut -c1-300)"
